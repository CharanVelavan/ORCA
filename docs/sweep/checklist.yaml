- id: CL-01
  area: control_link
  question: Does the national policy require satellite command, control, and telemetry links to implement validated encryption
    and cryptographic authentication to prevent unauthorized command execution?
  why_it_matters_ntn: Compromise of the command uplink allows malicious actors to hijack space vehicles, alter orbital trajectories,
    or disable satellite payloads permanently.
  references:
  - doc: US Space Policy Directive-5 (SPD-5)
    authority: Executive Office of the President of the United States
    pinpoint: Section 4(b)(i)
    url: https://www.federalregister.gov/documents/2020/09/10/2020-20150/cybersecurity-principles-for-space-systems
    quote: Protection against unauthorized access to critical space vehicle functions. This should include safeguarding command,
      control, and telemetry links using effective and validated authentication or encryption measures
    binding: guidance
    fetched: true
  - doc: CCSDS 355.0-B-2 (SDLS)
    authority: Consultative Committee for Space Data Systems (CCSDS)
    pinpoint: Section 1.3, Page 1-2
    url: https://public.ccsds.org/Pubs/355x0b2.pdf
    quote: providing authentication, data integrity, replay protection, and/or data confidentiality.
    binding: standard
    fetched: true
