# Seed checklist for sweep part 2 (Claude, 7 Nov). Agent B's checklist.yaml extends it later.
- {id: SD-01, area: ground_segment, question: "Must satellite gateways / earth stations meet specific cyber security requirements?", search_terms: [gateway, earth station, ground station, ground segment, teleport, hub]}
- {id: SD-02, area: control_link, question: "Must satellite command and control (TT&C) links be encrypted or authenticated?", search_terms: [telemetry, telecommand, TT&C, command and control, encrypt, authentication, uplink]}
- {id: SD-03, area: jamming_spoofing, question: "Must operators report RF jamming, interference or GNSS spoofing incidents?", search_terms: [jamming, interference, spoofing, GNSS, GPS, harmful interference]}
- {id: SD-04, area: licensing, question: "Do satellite communication licences / authorisations carry cyber security conditions?", search_terms: [GMPCS, satellite, authorisation, licence, license, VSAT, satellite-based]}
- {id: SD-05, area: user_terminal, question: "Are there security standards or certification for satellite user terminals / modems?", search_terms: [terminal, modem, user equipment, customer premises, certification, testing, trusted source]}
- {id: SD-06, area: supply_chain, question: "Are satellite / telecom equipment and components subject to supply-chain security checks?", search_terms: [trusted source, trusted product, supply chain, procure, vendor, testing and certification]}
- {id: SD-07, area: data_location, question: "Must satellite services keep gateways, traffic or logs in India?", search_terms: [within India, located in India, India, localis, gateway in India, store, maintain logs]}
- {id: SD-08, area: info_sharing, question: "Is there a sector body or duty for sharing threat information among operators?", search_terms: [information sharing, share, ISAC, threat intelligence, coordination, advisory]}
- {id: SD-09, area: vuln_disclosure, question: "Is there a vulnerability disclosure route for satellite / telecom systems?", search_terms: [vulnerabilit, disclosure, report, bug, responsible]}
- {id: SD-10, area: failover, question: "Must failover / alternate paths be security-checked before traffic moves?", search_terms: [failover, alternate, backup path, redundan, resilien, continuity]}
- {id: SD-11, area: downstream_warning, question: "Must an operator warn dependent customers / critical services after an incident?", search_terms: [notify, inform, customers, users, public, disclosure, stakeholder]}
- {id: SD-12, area: capacity_priority, question: "Is there a standing priority order for emergency / critical services on scarce capacity?", search_terms: [priority, emergency, public emergency, disaster, critical service, routed on priority]}
- {id: SD-13, area: backup_power, question: "Is there a minimum backup power / battery duration for telecom sites?", search_terms: [battery, backup power, power backup, UPS, diesel, generator, hours of backup]}
- {id: SD-14, area: joint_command, question: "Is there a defined joint incident command across operators, CERT and regulators?", search_terms: [coordinat, joint, crisis management, command, committee, nodal]}
- {id: SD-15, area: incident_reporting, question: "Are incident reporting clocks and triggers consistent across regulators?", search_terms: [six hours, 6 hours, report, occurrence, noticing, aware, within]}
- {id: SD-16, area: governance, question: "Is the space / satellite cyber framework binding, and who enforces it?", search_terms: [advisory, binding, mandatory, guideline, shall, comply, enforce]}
- {id: SD-17, area: incident_reporting, question: "Is satellite / space-segment compromise explicitly a reportable incident type?", search_terms: [satellite, space, types of cyber security incidents, Annexure, reportable]}
- {id: SD-18, area: standards, question: "Do Indian rules reference security standards for NTN / satellite links (3GPP, ITU, CCSDS)?", search_terms: [3GPP, ITU, CCSDS, standard, ISO, TEC, specification]}
