      \ sub-section (1) of section 3 of the Act"
  - source: in-telact-2023
    page: 3
    pinpoint: Section 2(s)
    quote: (s) "telecommunication network" means a system or series of systems of telecommunication equipment or infrastructure,
      including terrestrial or satellite networks
