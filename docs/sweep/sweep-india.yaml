    quote: 'Each telecommunication entity shall ensure compliance with the following measures to ensure telecom cyber security:
      (a) adopt a telecom cyber security policy'
  - source: in-tcsr-2024
    page: 8
    pinpoint: Rule 2(1)(f)
    quote: "\u201Ctelecommunication entity\" means any person providing telecommunication services, or establishing, operating,\
