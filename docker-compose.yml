# ORCA-NTN: Orchestrated Response and Coordination Agents for NTN
# All satellite and NTN links in this testbed are emulated.
#
# LLM Modes supported:
#   1. Default: mock (offline deterministic mock for judges, no network/API key needed)
#      LLM_BASE_URL=mock
#      LLM_MODEL=mock
#
#   2. Host OpenAI-compatible model server (use its advertised model ID):
#      LLM_BASE_URL=http://host.docker.internal:1234/v1
#      LLM_MODEL=orca-ntn-qwen-ft
#
#   3. Hosted Qwen endpoint (GCP / Atlas tunnel):
#      LLM_BASE_URL=http://host.docker.internal:8000/v1
#      LLM_MODEL=Qwen/Qwen3.6-35B-A3B

services:
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: orca-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  orca:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca-app
    depends_on:
      - chroma
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Default to mock offline LLM for judge reproducibility
      - LLM_BASE_URL=${LLM_BASE_URL:-mock}
      - LLM_MODEL=${LLM_MODEL:-mock}
      - ORCA_CHROMA_DIR=/app/chroma
    command: python run_demo.py --scenario s1
