# EMULATED device configuration (ORCA-NTN sandbox). Not a real device. No secrets: credentials are
# references to an emulated vault, never values.
id: CHN-01
kind: site
owner: mobile_operator
country: IN
area: Park Town
description: Cell-site router and power controller at Park Town, emulated
firmware:
  version: 2.8.0
  signed: true
backhaul:
  active_path: A
  paths:
  - id: A
    kind: satellite
    gateway: GW-IN-1
    failover_allowed: true
  - id: B
    kind: microwave
    gateway: GW-IN-2
    failover_allowed: true
power:
  battery_kwh: 10
  battery_saving:
    configured: false
    enabled: false
    shed: []
mgmt_interface:
  exposure: mgmt_vlan_only
  protocols:
  - ssh
auth:
  mfa_required: true
accounts:
- user: site-ops
  role: operator
  enabled: true
  mfa: true
  credential_ref: vault:emulated/CHN-01/site-ops/v4
  credential_age_days: 20
  default_password: false
monitoring:
  reattack_watch: false
