id: S3
title: The cell that heals itself without trusting the backup
story: Hostile RF jamming targets an emulated satellite backhaul link while ORCA rejects an unverified candidate route and safely fails over to a verified Indian gateway.
kind: attack
start: "2026-11-10T19:00:00+05:30"
seed: 103
jurisdiction: IN
entity: {designated_cti: false}
m3_expected: attack-jamming
sites: [CHN-01, CHN-03]
everyday_impact:
  - {who: "112 callers", from: 6, what: "emergency calls fail"}
  - {who: "retail UPI users", from: 6, what: "transactions timeout"}
events:
  - t: 0
    actor: M1
    what: M1 flags an abrupt SNR drop and packet loss on primary satellite backhaul at CHN-03.
    signals:
      - {site: CHN-03, signal: snr_db, value: -2.4}
      - {site: CHN-03, signal: packet_loss, value: 0.40}
  - t: 6
    actor: M2
    what: M2 forecasts complete loss of primary satellite link margin.
    signals:
      - {site: CHN-03, signal: link_margin_db, value: -5.0}
  - t: 12
    actor: M3
    what: M3 confirms clear local weather and classifies degradation as active RF jamming.
    signals:
      - {site: CHN-03, signal: rain_mm_h, value: 0.0}
  - t: 19
    actor: mobile_operator
    what: Mobile operator proposes candidate path A for immediate failover.
    signals:
      - {site: CHN-03, signal: route_candidate, value: {path: A, gateway: GW-IN-1, integrity: unverified}}
  - t: 24
    actor: satellite_operator
    what: Satellite operator finds candidate path A fails integrity verification.
    signals:
      - {site: CHN-03, signal: route_candidate, value: {path: A, gateway: GW-IN-1, integrity: failed}}
  - t: 28
    actor: gap_analyst
    what: Gap Analyst audits statutory failover path security verification rules.
    facts:
      obligation_questions:
        - {id: Q-S3-CLEAN, topic: failover_path_security, text: "Is there a binding requirement to verify candidate failover path security?"}
    expect:
      - {verdict: POTENTIAL_GAP, gap: GAP-IN-08-NO-CLEAN-PATH-CHECK}
  - t: 34
    actor: gap_analyst
    what: Gap Analyst audits mandatory cyber security standards for satellite failover.
    facts:
      obligation_questions:
        - {id: Q-S3-STD, topic: standards, text: "Are specific cyber security standards mandated for NTN failover routes?"}
    expect:
      - {verdict: POTENTIAL_GAP, gap: GAP-IN-06-STANDARDS}
  - t: 38
    actor: mobile_operator
    what: PB-06 precondition blocks GW-XX (Authz Rule 60(1)(b)).
    signals:
      - {site: CHN-03, signal: route_candidate, value: {path: C, gateway: GW-XX, integrity: verified}}
  - t: 42
    actor: satellite_operator
    what: Satellite operator verifies clean domestic candidate path B via GW-IN-2.
    signals:
      - {site: CHN-03, signal: route_candidate, value: {path: B, gateway: GW-IN-2, integrity: verified}}
    facts:
      obligation_questions:
        - {id: Q-S3-LOC, topic: data_location, text: "Is backup gateway located in India per Authz Rule 60(1)(b)?"}
    expect:
      - {verdict: COMPLIANT}
  - t: 50
    actor: commander
    what: Commander rejects unverified path A and foreign path C, approving PB-06 on verified domestic path B.
  - t: 68
    actor: M1
    what: M1 confirms recovery of cell site backhaul over path B.
    signals:
      - {site: CHN-03, signal: packet_loss, value: 0.03}
playbooks:
  - {id: PB-06, owner: mobile_operator, approver: commander, executed: true,
     precondition: "path integrity verified and gateway in India (Authz Rule 60(1)(b))"}
heal:
  what: Tower CHN-03 fails over from jammed primary link to clean verified domestic route.
  metric: packet_loss
  service: 112
  site: CHN-03
  target_before: 0.40
  target_after: 0.03
  proof: [route trace shows GW-IN-2, path B integrity verified, packet_loss measured after]
human_decisions:
  - "Commander rejects unverified trap path A despite immediate availability."
  - "Commander enforces Indian gateway requirement blocking foreign route proposal GW-XX."
  - "Commander approves PB-06 execution exclusively on verified domestic path B."
rules_off: "Without the rule engine, automated routing picks the lowest-latency unverified path, failing into an attacker-controlled trap."
demo_seconds: 90
risks:
  - "NEEDS CHECK: Specific cryptographic criteria for automated clean-path integrity verification."
