    actor: M1
    what: M1 confirms all operational traffic successfully rerouted onto protected domestic path.
    signals:
      - {site: CHN-05, signal: link_protection, value: protected}
playbooks:
  - {id: PB-06, owner: mobile_operator, approver: commander, executed: true,
     precondition: "path integrity verified and gateway in India (Authz Rule 60(1)(b))"}
heal:
  what: Coastal tower CHN-05 shifts traffic away from unprotected satellite feeder link to verified protected domestic path.
  metric: packet_loss
  service: general
  site: CHN-05
  target_before: 1.00
  target_after: 0.00
  proof: [route trace shows GW-IN-2, unencrypted path decommissioned]
human_decisions:
