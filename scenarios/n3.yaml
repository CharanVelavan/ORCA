    actor: judge
    what: Judge injects synthetic audit inspecting feeder link security controls.
    signals:
      - {site: CHN-05, signal: link_protection, value: unprotected}
  - t: 6
    actor: satellite_operator
    what: Satellite operator discovers test feeder link operating without link-layer encryption.
  - t: 12
