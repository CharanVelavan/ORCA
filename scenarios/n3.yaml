    actor: commander
    what: Commander approves PB-06 failover to protected domestic gateway.
    facts:
      obligation_questions:
        - {id: Q-N3-LOC, topic: data_location, text: "Is protected backup gateway located inside India per Authz Rule 60(1)(b)?"}
