- id: IN-AUTHZ-2026-R59-4
  jurisdiction: IN
  instrument: Telecommunications (Authorisation for Provision of Principal Telecommunication Services) Rules, 2026
  clause: Rule 59(4)(a)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2026-06-23
  in_force_from: 2026-06-23
  topic: interference_reporting
  topics: [interference_reporting]
  quote: "unauthorised satellite signal that it may detect originating or terminating within India; and"
  pinpoint: Rule 59(4)(a), PDF p. 112
  summary: Satellite-network licensees must report unauthorised satellite signals they detect (and, under 59(4)(b), unauthorised access to their satellites). No deadline is set.
  source: in-authz-rules-2026
  verified: true
  verified_by: PDF opened by Claude 7 Nov 2026 (sha256 matched an independent re-download)
  notes: Applies to "new authorised entities" (authorised under these Rules). Rogue signals, not cyber incidents in general; jamming of the operator's own links is not named.

- id: IN-AUTHZ-2026-R62-2
  jurisdiction: IN
  instrument: Telecommunications (Authorisation for Provision of Principal Telecommunication Services) Rules, 2026
  clause: Rule 62(2)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2026-06-23
  in_force_from: 2026-06-23
  topic: data_location
  topics: [data_location]
  quote: "The operation, maintenance and control facility for the satellite earth station gateway and user terminals connected with the satellite network of a new authorised entity shall be located in India."
  pinpoint: Rule 62(2), PDF p. 114
  summary: The control facility for satellite gateways and user terminals must be in India. Rule 59(3)(a) also requires each gateway to be located in India.
  source: in-authz-rules-2026
  verified: true
  verified_by: PDF opened by Claude 7 Nov 2026
  notes: A sovereignty and lawful-interception condition (Chapter VII). It does not set cyber-resilience controls for the gateway.

- id: IN-AUTHZ-2026-R62-7
  jurisdiction: IN
  instrument: Telecommunications (Authorisation for Provision of Principal Telecommunication Services) Rules, 2026
  clause: Rule 62(7) and 62(11)(a)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2026-06-23
  in_force_from: 2026-06-23
  topic: terminal_control
  topics: [terminal_control]
  quote: "Every new authorised entity shall report to the Central Government on the portal, any attempt to access or use the satellite network by a user terminal not registered under sub-rule (6)"
  pinpoint: Rule 62(7), PDF p. 114; 62(11)(a) bans location-spoofing tools in user terminals
  summary: Satellite licensees must register user terminals, report access attempts by unregistered terminals, and keep location-spoofing tools out of terminals.
  source: in-authz-rules-2026
  verified: true
  verified_by: PDF opened by Claude 7 Nov 2026
  notes: Terminal control for security and sovereignty. No secure-boot, firmware-signing or terminal security baseline is set.

- id: IN-AUTHZ-2026-R38-2-a
  jurisdiction: IN
  instrument: Telecommunications (Authorisation for Provision of Principal Telecommunication Services) Rules, 2026
  clause: Rule 38(1) and 38(2)(a)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2026-06-23
  in_force_from: 2026-06-23
  topic: public_alerts
  topics: [public_alerts]
  quote: "facilitate dissemination of alert messages through short message service, cell broadcast or any other means as may be directed by Central Government, State Government or any officer authorised in this behalf"
  pinpoint: Rule 38(2)(a), PDF p. 101
  summary: In disasters, licensees follow government directions (38(1)); access-service licensees must carry public alert messages when directed (38(2)(a)) and implement roaming per guidelines (38(2)(b)).
  source: in-authz-rules-2026
  verified: true
  verified_by: PDF opened by Claude 7 Nov 2026
  notes: Government-to-public alerts on direction. Not an operator duty to warn dependent services after a cyber incident (GAP-IN-02).

