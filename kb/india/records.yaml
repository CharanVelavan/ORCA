# --- Data protection --------------------------------------------------------------------
- id: IN-DPDP-ACT-2023-8-6
  jurisdiction: IN
  instrument: Digital Personal Data Protection Act, 2023
  clause: Section 8(6)
  authority: Parliament of India / MeitY
  binding_status: binding_not_in_force
  issued: 2023-08-11
  in_force_from: 2027-05-13
  topic: personal_data_breach
  topics: [personal_data_breach]
  obligation:
    actor: data_fiduciary
    action: intimate_personal_data_breach
    recipient: Data Protection Board and affected Data Principals
    deadline: null
    trigger: awareness
  quote: "In the event of a personal data breach, the Data Fiduciary shall give the Board and each affected Data Principal, intimation of such breach in such form and manner as may be prescribed."
  pinpoint: Section 8(6), PDF p. 11
  summary: A Data Fiduciary intimates the Board and each affected Data Principal of a personal data breach, in the prescribed form and manner.
  source: in-dpdp-act-2023
  verified: true
  verified_by: PDF opened 7 Nov 2026 (kb/sources, sha256 in sources.yaml)
  notes: Enacted 11 Aug 2023 (checked in the PDF). Section 8 commences with DPDP Rules 2025 rule 1(4), about 13 May 2027; until then not in force.

- id: IN-DPDP-RULES-2025-R7
  jurisdiction: IN
  instrument: Digital Personal Data Protection Rules, 2025
  clause: Rule 7
  authority: MeitY
  binding_status: binding_not_in_force
  issued: 2025-11-13
  in_force_from: 2027-05-13
  topic: personal_data_breach
  topics: [personal_data_breach]
  obligation:
    actor: data_fiduciary
    action: detailed_breach_intimation_to_board
    recipient: Data Protection Board
    deadline: PT72H
    trigger: awareness
  quote: "within seventy-two hours of becoming aware of the breach, or within such longer period as the Board may allow on a request made in writing in this behalf"
  pinpoint: Rule 7(2)(b), PDF p. 26
  summary: Initial intimation to the Board without delay; detailed intimation within 72 hours (or longer if the Board allows); affected Data Principals informed without delay.
  source: in-dpdp-rules-2025
  verified: true
  verified_by: PDF opened 7 Nov 2026 (kb/sources, sha256 in sources.yaml)
  notes: Rule 1(4) says rules 3, 5 to 16, 22 and 23 "shall come into force eighteen months after the date of publication". Commences 18 months after Gazette publication (13 Nov 2025), so about 13 May 2027. No binding breach clock applies today.

