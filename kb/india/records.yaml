- id: IN-ITACT-2000-70B
  jurisdiction: IN
  instrument: Information Technology Act, 2000
  clause: Section 70B(4) and 70B(6)
  authority: Parliament of India
  binding_status: binding
  issued: 2000-06-09
  in_force_from: null
  topic: cert_powers
  topics: [cert_powers]
  quote: "may call for information and give direction to the service providers, intermediaries, data centres, body corporate and any other person."
  pinpoint: Section 70B(6), PDF p. 30
  summary: 70B(4) sets CERT-In's functions, including incident response and coordination; 70B(6) lets it call for information and issue directions. The Act itself sets no reporting deadline.
  source: in-itact-2000
  verified: true
  verified_by: PDF opened 7 Nov 2026 (kb/sources, sha256 in sources.yaml)
  notes: Enacted 9 Jun 2000 (checked). 70B(4) lists CERT-In's functions, incl. "coordination of cyber incidents response activities". 70A/70B were inserted by the 2008 amendment; in_force_from not recorded.

- id: IN-TELACT-2023-20
  jurisdiction: IN
  instrument: Telecommunications Act, 2023
  clause: Section 20(1)(b)
  authority: Parliament of India / DoT
  binding_status: binding
  issued: 2023-12-24
  in_force_from: null
  topic: emergency_powers
  topics: [emergency_powers]
  quote: "provide for appropriate mechanism to ensure that messages of a user or group of users authorised for response and recovery during public emergency are routed on priority."
  pinpoint: Section 20(1)(b), PDF p. 9
  summary: In a public emergency, the Central or a State Government may, by notification, route the messages of authorised responders on priority. It is a power used case by case, not a standing order across service classes (112 callers, hospitals, water, payments).
  source: in-telact-2023
  verified: true
  verified_by: PDF opened 7 Nov 2026 (kb/sources, sha256 in sources.yaml)
  notes: Corrects the earlier summary ("contains no priority-routing order"). Nearest provision for GAP-IN-03. Commences in phases (s.1(3)); commencement notification not in our sources.

