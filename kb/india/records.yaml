# --- Telecom rules, 2024 ------------------------------------------------------------------
- id: IN-TCSR-2024-R7-1
  jurisdiction: IN
  instrument: Telecommunications (Telecom Cyber Security) Rules, 2024
  clause: Rule 7(1)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2024-11-21
  in_force_from: 2024-11-21
  topic: incident_reporting
  topics: [incident_reporting, telecom_cyber_security]
  obligation:
    actor: telecommunication_entity
    action: report_security_incident
    recipient: Central Government (DoT)
    deadline: PT6H
    trigger: occurrence
  quote: "such entity shall report the same to the Central Government within six (6) hours of such occurrence"
  pinpoint: Rule 7(1), PDF p. 11
  summary: A security incident affecting a telecommunication entity is reported to the Central Government within six hours of occurrence.
  source: in-tcsr-2024
  verified: true
  verified_by: charan/india-citation-check.md (5 Nov 2026)
  notes: Counted from occurrence, not noticing, unlike CERT-In Direction (ii). The 2025 amendment (G.S.R. 771(E), 22 Oct 2025) inserts Rule 7A on number validation and does not change Rule 7 (checked 7 Nov 2026).

- id: IN-CTIR-2024-R7-1-j
  jurisdiction: IN
  instrument: Telecommunications (Critical Telecommunication Infrastructure) Rules, 2024
  clause: Rule 7(1)(j)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2024-11-22
  in_force_from: 2024-11-22
  topic: critical_infrastructure
  topics: [critical_infrastructure, incident_reporting]
  obligation:
    actor: critical_telecommunication_infrastructure_owner
    action: intimate_incident
    recipient: Central Government (DoT)
    deadline: PT6H
    trigger: occurrence
  quote: "no later than six hours of occurrence of such incident"
  pinpoint: Rule 7(1)(j), PDF p. 8
  summary: Incidents affecting designated critical telecommunication infrastructure are intimated within six hours of occurrence. Notified as G.S.R. 723(E).
  source: in-ctir-2024
  verified: true
  verified_by: charan/india-citation-check.md (5 Nov 2026)
  notes: Applies only if the asset is designated as critical telecommunication infrastructure.

