- id: IN-TELACT-2023-2-s
  jurisdiction: IN
  instrument: Telecommunications Act, 2023
  clause: Section 2(s)
  authority: Parliament of India / DoT
  binding_status: binding
  issued: 2023-12-24
  in_force_from: null
  topic: ntn_coverage
  topics: [ntn_coverage]
  quote: "\"telecommunication network\" means a system or series of systems of telecommunication equipment or infrastructure, including terrestrial or satellite networks or submarine networks"
  pinpoint: Section 2(s), PDF p. 3
  summary: Satellite networks are telecommunication networks under the Act, so telecom duties reach NTN operators. Negative control for "is NTN covered at all?".
  source: in-telact-2023
  verified: true
  verified_by: PDF opened 7 Nov 2026 (kb/sources, sha256 in sources.yaml)
