# --- Telecom rules, 2024 ------------------------------------------------------------------
- id: IN-TCSR-2024-R7-1
  jurisdiction: IN
  instrument: Telecommunications (Telecom Cyber Security) Rules, 2024 (G.S.R. 720(E), 21 Nov 2024)
  clause: Rule 7(1)(a)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2024-11-21
  in_force_from: 2024-11-21
  topic: incident_reporting
  topics: [incident_reporting, telecom_cyber_security]
  obligation:
    actor: telecommunication_entity
    action: report_security_incident
    recipient: Central Government (DoT)
    deadline: PT6H
    trigger: awareness
  quote: "within six hours of becoming aware of a security incident affecting its telecommunication network or telecommunication service, report the same to the Central Government with relevant details of the affected system including the description of such incident; and"
  pinpoint: Rule 7(1)(a), PDF p. 5 of the notified Gazette text; Rule 7(1)(b) adds details "within twenty-four hours of becoming aware"
  summary: A telecommunication entity reports a security incident to the Central Government within six hours of becoming aware of it, and gives users affected, duration, area, impact and remedies within twenty-four hours.
  source: in-tcsr-2024
  verified: true
  verified_by: Notified Gazette G.S.R. 720(E) opened by Claude 7 Nov 2026 (replaces the draft G.S.R. 520(E) that was on disk)
  notes: CORRECTED 7 Nov 2026 night. Earlier text ("within six (6) hours of such occurrence", 5 Nov citation check) was the 28 Aug 2024 DRAFT, G.S.R. 520(E). Found by Goldfish reviewer G1; external-review lead R1 was right. Trigger is awareness, close to CERT-In's "noticing"; CTIR Rule 7(1)(j) still counts from occurrence. The 2025 amendment (G.S.R. 771(E)) inserts Rule 7A and does not change Rule 7.


- id: IN-CTIR-2024-R7-1-j
  jurisdiction: IN
  instrument: Telecommunications (Critical Telecommunication Infrastructure) Rules, 2024
  clause: Rule 7(1)(j)
  authority: Department of Telecommunications
  binding_status: binding
  issued: 2024-11-22
  in_force_from: 2024-11-22
  topic: critical_infrastructure
  topics: [critical_infrastructure, incident_reporting]
  obligation:
    actor: critical_telecommunication_infrastructure_owner
    action: intimate_incident
    recipient: Central Government (DoT)
    deadline: PT6H
    trigger: occurrence
  quote: "no later than six hours of occurrence of such incident"
  pinpoint: Rule 7(1)(j), PDF p. 8
  summary: Incidents affecting designated critical telecommunication infrastructure are intimated within six hours of occurrence. Notified as G.S.R. 723(E).
  source: in-ctir-2024
  verified: true
  verified_by: charan/india-citation-check.md (5 Nov 2026)
  notes: Applies only if the asset is designated as critical telecommunication infrastructure.

# --- Space framework, 2026 ----------------------------------------------------------------
- id: IN-SPACEFW-2026-3-2-1
  jurisdiction: IN
  instrument: CERT-In / SIA-India Cyber Security Framework and Guidelines for Space including Satellite Communication
  clause: §3.2.1
  authority: CERT-In with SIA-India
  binding_status: non_binding
  issued: 2026-02-26
  in_force_from: null
  topic: space_cyber
  topics: [space_cyber, incident_reporting]
  obligation:
    actor: satcom_operator_or_service_provider
    action: report_cyber_incident
    recipient: CERT-In
    deadline: PT6H
    trigger: noticing
  quote: "All SatCom operators and service providers must report cybersecurity incidents, breaches, or anomalies within 6 hours of noticing the incident to CERT-In."
  pinpoint: §3.2.1, PDF p. 12
  summary: Repeats the six-hour CERT-In clock for satellite operators; §7.1 (PDF p. 33) says the same.
  source: in-space-fw-2026
  verified: true
  verified_by: charan/india-citation-check.md (5 Nov 2026)
  notes: The PDF itself does not state its legal status. PIB release 2233122 (26 Feb 2026, MeitY) says "These guidelines are advisory in nature" (source in-pib-space-fw-2026), so binding_status is non_binding from 7 Nov 2026. Binding duties from other law (e.g. CERT-In Direction (ii)) still apply.

- id: IN-SPACEFW-2026-ANXB-IV
  jurisdiction: IN
  instrument: CERT-In / SIA-India Cyber Security Framework and Guidelines for Space including Satellite Communication
  clause: Annexure B (Self-Assessment Maturity Checklist), IV Respond, SATCOM-specific focus
