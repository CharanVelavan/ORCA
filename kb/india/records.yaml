# --- CERT-In Directions, 28 April 2022 -------------------------------------------------
- id: IN-CERTIN-DIR-2022-ii
  jurisdiction: IN
  instrument: CERT-In Directions under section 70B(6) of the IT Act, 2000
  clause: Direction (ii)
  authority: CERT-In
  binding_status: binding
  issued: 2022-04-28
  in_force_from: 2022-06-27
  topic: incident_reporting
  topics: [incident_reporting]
  obligation:
    actor: service_provider_intermediary_data_centre_body_corporate_government
    action: report_cyber_incident
    recipient: CERT-In
    deadline: PT6H
    trigger: noticing
  quote: "shall mandatorily report cyber incidents as mentioned in Annexure I to CERT-In within 6 hours of noticing such incidents or being brought to notice about such incidents."
  pinpoint: Direction (ii), PDF p. 2
  summary: Annexure I incidents go to CERT-In within six hours of noticing them. The CERT-In FAQ explains severity and scale criteria for applying the deadline.
  source: in-certin-dir-2022
  verified: true
  verified_by: charan/india-citation-check.md (5 Nov 2026)
  notes: In force from 2022-06-27 ("effective after 60 days" from 28 Apr 2022, PDF p. 3).

