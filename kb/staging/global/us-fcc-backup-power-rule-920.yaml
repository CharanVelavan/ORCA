candidate_quotes:
  - quote: "Providers of a Covered Service shall, at the point of sale for a Covered Service, offer subscribers the option to purchase backup power for the Covered Service as follows: (1) Eight hours. Providers shall offer for sale at least one option with a minimum of eight hours of standby backup power. (2) Twenty-four hours. By February 13, 2019, providers of a Covered Service shall offer for sale also at least one option that provides a minimum of twenty-four hours of standby backup power."
    page: null
    clause: "47 CFR § 9.20(b)"
    topic: backup_power
    gap: GAP-IN-04
    supports: global_example
    why: "Prescribes commercial customer backup power offering requirements (8 hours and 24 hours options) for non-line-powered voice services."
  - quote: "The backup power offered for purchase under paragraph (b) of this section must include power for all provider-furnished equipment and devices installed and operated on the customer premises that must remain powered in order for the service to provide 911 access."
    page: null
    clause: "47 CFR § 9.20(c)"
    topic: backup_power
    gap: GAP-IN-04
    supports: global_example
    why: "Specifies that customer premises backup power must cover all provider-furnished devices essential for 911 emergency call delivery."
  - quote: "The requirements of this section shall no longer be in effect as of September 1, 2025."
    page: null
