candidate_quotes:
  - quote: "Critical infrastructure comprises the physical and virtual assets and systems so vital to the Nation that their incapacity or destruction would have a debilitating impact on national security, national economic security, or national public health or safety."
    page: null
    clause: "Preamble"
    topic: critical_infrastructure
    gap: GAP-IN-03
    supports: global_example
    why: "Re-defines vital critical infrastructure scope across physical and cyber-virtual assets."
  - quote: "The Federal Communications Commission will, to the extent permitted by law and in coordination with DHS and other Federal departments and agencies: (1) identify and prioritize communications infrastructure by collecting information regarding communications networks; (2) assess communications sector risks and work to mitigate those risks by requiring, as appropriate, regulated entities to take specific actions to protect communications networks and infrastructure; and (3) collaborate with communications sector industry members, foreign governments, international organizations, and other stakeholders to identify best practices and impose corresponding regulations."
    page: null
    clause: "Policy Principles and Objectives"
    topic: emergency_powers
    gap: GAP-IN-03
    supports: global_example
    why: "Explicitly coordinates FCC regulatory mandates and communications sector risk management with DHS and CISA."
  - quote: "In accordance with applicable law and policy, Federal departments and agencies with regulatory authorities shall utilize regulation, drawing on existing voluntary consensus standards as appropriate, to establish minimum requirements and effective accountability mechanisms for the security and resilience of critical infrastructure."
    page: null
    clause: "Policy Principles and Objectives"
    topic: standards
    gap: GAP-IN-09
    supports: global_example
    why: "Directs federal regulatory agencies to turn voluntary consensus standards into mandatory minimum resilience requirements."
