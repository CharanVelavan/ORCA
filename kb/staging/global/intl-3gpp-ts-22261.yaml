  - quote: "The 5G system shall allow flexible mechanisms to establish and enforce priority policies among the different services (e.g. MPS, Emergency, medical, Public Safety) and users."
    page: 5
    clause: "6.7.2"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Specifies technical requirements for enforcing priority policies across emergency, public safety, and other communication services."
  - quote: "A 5G system with satellite access shall be able to determine a UE's location in order to provide service (e.g. route traffic, support emergency calls) in accordance with the governing national or regional regulatory requirements applicable to that UE."
    page: 5
    clause: "6.3.2.3"
    topic: standards
    gap: null
    supports: context
    why: "Requires location determination capabilities in satellite access networks to support regulatory emergency call routing."
  - quote: "Subject to regulatory requirements or operator's policy, 3GPP system shall be able to enable a UE of a given PLMN to obtain connectivity service (e.g. voice call, mobile data service) from another PLMN for the area where a Disaster Condition applies."
    page: 5
    clause: "6.31.2.1"
    topic: disaster_coordination
    gap: null
    supports: context
    why: "Specifies disaster roaming requirements enabling user equipment to obtain connectivity from alternate networks during disaster conditions."
