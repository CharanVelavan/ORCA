candidate_quotes:
- quote: 'Member States shall ensure that critical entities take appropriate and proportionate technical, security and organisational
    measures to ensure their resilience, based on the relevant information provided by Member States on the Member State risk
    assessment and on the outcomes of the critical entity risk assessment, including measures necessary to:'
  page: 20
  clause: Article 13(1)
  topic: critical_infrastructure
  gap: GAP-IN-06
  supports: global_example
  why: Requires critical infrastructure operators to adopt technical, security, and organizational resilience measures.
- quote: recover from incidents, duly considering business continuity measures and the identification of alternative supply
    chains, in order to resume the provision of the essential service;
  page: 20
  clause: Article 13(1)(d)
  topic: backup_power
  gap: GAP-IN-04
  supports: global_example
  why: Mandates business continuity, resilience, and recovery mechanisms to maintain essential service delivery.
- quote: Member States shall ensure that, unless operationally unable to do so, critical entities submit an initial notification
    no later than 24 hours after becoming aware of an incident, followed, where relevant, by a detailed report no later than
    one month thereafter.
  page: 22
  clause: Article 15(1)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: global_example
  why: Establishes a 24-hour mandatory initial incident reporting window for critical entities disrupting essential services.
