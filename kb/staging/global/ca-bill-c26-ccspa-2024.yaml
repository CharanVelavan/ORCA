- quote: Part 2 enacts the Critical Cyber Systems Protection Act to provide a framework
    for the protection of the critical cyber systems of services and systems that
    are vital to national security or public safety and that are delivered or operated
    as part of a work, undertaking or business that is within the legislative authority
    of Parliament.
