- quote: SUMMARY Part 1 amends the Telecommunications Act to add the promotion of
    the security of the Canadian telecommunications system as an objective of the
    Canadian telecommunications policy and to authorize the Governor in Council and
    the Minister of Industry to direct telecommunications service providers to do
    anything, or refrain from doing anything, that is necessary to secure the Canadian
    telecommunications system.
  page: 1
