- quote: Regardless of its format, it should exist as an entity in the organization, and have the authority and resources
    to implement security services to enable the organization to be secured.
  page: 8
  clause: Clause 7
  topic: joint_command
  gap: GAP-IN-07
  supports: global_example
  why: Mandates establishing a dedicated cyber defence entity endowed with organizational authority and resources to execute
    security operations.
- quote: The incident notification service is to communicate the occurrence of an incident to incident response teams and
    other concerned groups.
  page: 21
  clause: Clause A.4.6
  topic: incident_reporting
  gap: GAP-IN-01
  supports: global_example
  why: Specifies formal incident notification mechanisms within cyber defence centre operations to alert response teams and
    stakeholders.
- quote: The security vendor collaboration service is to build a direct line of communication with the provider of a security
    product or service purchased, requests a response to any deficiencies found in the security response and exchanges positive
    feedback on areas for improvement.
  page: 24
  clause: Clause A.9.4
  topic: telecom_cyber_security
  gap: GAP-IN-09
  supports: global_example
  why: Establishes structured vendor engagement channels for reporting equipment security deficiencies and coordinating remediations.
