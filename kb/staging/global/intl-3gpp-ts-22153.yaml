candidate_quotes:
- quote: Upon invocation of MPS, the system shall provide preferential treatment for access and core network resources associated
    with the session (i.e., signalling and media bearer related resources within a domain and across domains), including,
    when applicable, priority treatment towards an enterprise network supporting MPS.
  page: 9
  clause: Clause 5.1
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Mandates end-to-end preferential resource allocation for signalling and media bearers during Multimedia Priority Service
    sessions.
- quote: A Service User is assigned a priority level by a regional/national authority i.e., agency authorised to issue priority
    levels.
  page: 9
  clause: Clause 5.1
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Affirms that priority levels are authoritative assignments governed by designated national regulatory and emergency
    management agencies.
- quote: Pre-emption of active sessions shall be subject to regional/national regulatory requirements.
  page: 9
  clause: Clause 5.1
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Conditions session pre-emption upon national telecommunications regulatory frameworks and emergency priority rules.
