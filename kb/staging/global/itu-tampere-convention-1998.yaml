candidate_quotes:
  - quote: "The States Parties shall cooperate among themselves and with non-State entities and intergovernmental organizations, in accordance with the provisions of this Convention, to facilitate the use of telecommunication resources for disaster mitigation and relief."
    page: 57
    clause: "Article 3.1"
    topic: disaster_coordination
    gap: GAP-IN-03
    supports: global_example
    why: "Mandates international state cooperation with private and intergovernmental entities for emergency disaster telecommunication deployment."
  - quote: "the deployment of terrestrial and satellite telecommunication equipment to predict, monitor and provide information concerning natural hazards, health hazards and disasters;"
    page: 57
    clause: "Article 3.2(a)"
    topic: emergency_powers
    gap: GAP-IN-03
    supports: global_example
    why: "Explicitly authorizes rapid operational deployment of satellite and terrestrial communication infrastructure for hazard monitoring."
  - quote: "The States Parties shall, when possible, and in conformity with their national law, reduce or remove regulatory barriers to the use of telecommunication resources for disaster mitigation and relief, including to the provision of telecommunication assistance."
    page: 62
    clause: "Article 9.1"
    topic: backup_power
    gap: GAP-IN-04
    supports: global_example
    why: "Obligates signatory nations to waive customs, licensing, and spectrum barriers impeding emergency relief communications."
