candidate_quotes:
- quote: Union space operators shall take all the necessary measures to manage the risks posed to the security of network
    and information systems and the security of the physical infrastructure and environment, in accordance with the principle
    of proportionality, taking into account their risk profile and size, as well as the nature, scale and complexity of their
    space activities.
  page: null
  clause: Article 76(1)
  topic: space_cyber
  gap: GAP-IN-09
  supports: global_example
  why: Imposes mandatory cybersecurity risk-management requirements across all space segments and physical infrastructure.
- quote: To date, the cybersecurity of the space sector has been only partly addressed at Union level through a general applicable
    framework as laid down by Directive (EU) 2022/2555. The current cybersecurity regime does not comprehensively cover all
    types of actors and services which are relevant for the space sector.
  page: null
  clause: Recital (68)
  topic: space_cyber
  gap: GAP-IN-09
  supports: global_example
  why: Acknowledges the policy gap in general cyber legislation for satellite and space assets, establishing the rationale
    for dedicated space cyber rules.
- quote: Without prejudice to paragraph 3, Union space operators shall report to the competent authorities referred to in
    Article 28(1) the significant incidents affecting the assets referred to in Article 5, first paragraph, point (21).
  page: null
  clause: Article 93(2)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: global_example
  why: Establishes dedicated space-incident notification duties to competent authorities for significant space infrastructure
    disruptions.
verified: false
notes: European Commission legislative proposal for the EU Space Act (COM/2025/335 final), establishing space sector cybersecurity
