candidate_quotes:
- quote: Until now, the design principle for interconnection between public land mobile network (PLMN) operators assumed that
    operators (at the service level) could completely trust each other, and the transmission of signalling and user data could
    also be trusted.
  page: 14
  clause: Clause 8.3.1
  topic: signalling_security
  gap: GAP-IN-08
  supports: global_example
  why: Notes the legacy telecom assumption of inherent trust across carrier interconnects and highlights the risk in modern
    multi-operator ecosystems.
- quote: As a result, operators can only guarantee security for IPX connections directly connected to them, and not for links
    between operators and all other links of operators.
  page: 14
  clause: Clause 8.3.1
  topic: failover_path_security
  gap: GAP-IN-06
  supports: global_example
  why: Highlights vulnerability of indirect and multi-operator interconnect paths when routing outside directly managed trust
    boundaries.
- quote: Supply chain risk management is the coordinated efforts of an organization to identify, monitor, detect and mitigate
    threats to supply chain continuity and profitability.
  page: 18
  clause: Clause 8.6.1
  topic: telecom_cyber_security
  gap: GAP-IN-09
  supports: global_example
  why: Establishes baseline organizational requirements for supply chain threat monitoring and operational continuity in IMT-2020
    deployments.
