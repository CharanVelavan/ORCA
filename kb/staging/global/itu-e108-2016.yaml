candidate_quotes:
- quote: In contrast, the characteristics of Internet protocol (IP) packet networks are such that, although localized congestion
    may occur, the user does not experience blocking to the extent that communication is fully cut off, but still has the
    ability to transfer information, although with possibly reduced throughput.
  page: 7
  clause: Clause 1
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Contrasts circuit-switched blocking with packet network resilience for disaster message transfer during severe network
    congestion.
- quote: However, call attempts may fail due to heavy congestion caused by the sudden increase of traffic and the possible
    drop of network capacity if the network itself is damaged by the disaster.
  page: 8
  clause: Clause 6.1
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Identifies disaster traffic surge and physical capacity degradation as the root cause of telecommunications call failure.
- quote: This condition should be satisfied even if the message-generating user and other users subscribe to different network
    operators.
  page: 12
  clause: Clause 8.4
  topic: downstream_warning
  gap: GAP-IN-02
  supports: global_example
  why: Requires inter-operator message delivery interoperability so disaster relief communications reach subscribers across
    different mobile carriers.
