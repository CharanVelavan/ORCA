candidate_quotes:
  - quote: "Emergency telecommunication traffic needs assured capabilities regardless of the networks traversed. A prime component of assured capabilities is enhanced priority treatment."
    page: 12
    clause: "Clause 7.1"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Mandates enhanced priority treatment and bearer-independent assured delivery for emergency communication flows."
  - quote: "Whenever possible, admission control or network policy can increase the probability of successful telecommunications by providing a preferential treatment to emergency telecommunications."
    page: 19
    clause: "Clause 7.15"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Prescribes dynamic admission control and policy routing prioritizing emergency calls during congestion."
  - quote: "Key network infrastructure supporting emergency telecommunications needs to be as robust as possible so as to endure throughout the disaster."
    page: 16
    clause: "Clause 7.9"
    topic: failover_path_security
    gap: GAP-IN-08
    supports: global_example
    why: "Establishes survivability and endurability baselines for core physical and transport network links."
