candidate_quotes:
  - quote: "When an aeronautical station receives calls in close succession from several aircraft stations, it decides on the order in which these stations may transmit their traffic. Its decision shall be based on the priority in Article 44."
    page: 401
    clause: "Article 45, No. 45.3 § 3"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Mandates capacity priority ordering for safety and emergency transmissions over satellite/aeronautical communication links."
  - quote: "If an aeronautical station finds it necessary to intervene in communications between aircraft stations, these stations shall comply with the instructions given by the aeronautical station."
    page: 401
    clause: "Article 45, No. 45.4 § 4"
    topic: emergency_powers
    gap: GAP-IN-03
    supports: global_example
    why: "Empowers controlling stations to intervene and preempt traffic in operational aeronautical/satellite communications."
  - quote: "Categories 1 and 2 shall receive priority over all other communications irrespective of any agreement under the provisions of No. 35.1."
    page: 399
    clause: "Article 44, No. 44.2 § 2"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Guarantees absolute legal pre-eminence for distress and urgency traffic over any commercial agreements."
verified: false
notes: "Binding international treaty adopted at WRC-23; covers aeronautical and mobile-satellite priority communication procedures."
