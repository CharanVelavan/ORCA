candidate_quotes:
- quote: The objective of the Service Resiliency Code is to ensure that telecommunication service providers providing key services to a large number of end users adopt proactive measures to invest in and
    improve the resilience of their telecommunication networks to prevent widespread service disruptions, and in the event such service disruptions occur, to ensure that these service providers take all
    measures to restore services as quickly as possible.
