- quote: Where appropriate, entities concerned shall notify, without undue delay, the recipients of their services of significant
    incidents that are likely to adversely affect the provision of those services.
  page: null
  clause: Article 23(1)
  topic: downstream_warning
  gap: GAP-IN-02
  supports: global_example
  why: Imposes a direct duty on covered entities to notify downstream recipients of significant incidents likely to affect
    services without undue delay.
- quote: without undue delay and in any event within 24 hours of becoming aware of the significant incident, an early warning,
    which, where applicable, shall indicate whether the significant incident is suspected of being caused by unlawful or malicious
    acts or could have a cross-border impact;
  page: null
  clause: Article 23(4)(a)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: global_example
  why: Sets a 24-hour early warning notification trigger for significant incidents suspected of malicious origin or cross-border
    impact.
- quote: Member States shall ensure that essential and important entities take appropriate and proportionate technical, operational
    and organisational measures to manage the risks posed to the security of network and information systems which those entities
    use for their operations or for the provision of their services, and to prevent or minimise the impact of incidents on
    recipients of their services and on other services.
  page: null
  clause: Article 21(1)
  topic: standards
  gap: GAP-IN-06
  supports: global_example
  why: Mandates risk management and technical measures to protect network infrastructure and prevent downstream impact.
