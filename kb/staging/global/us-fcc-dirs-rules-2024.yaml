candidate_quotes:
  - quote: "Cable Communications, Wireline, Wireless, and Interconnected VoIP providers shall be required to report their infrastructure status information each day in the Disaster Information Reporting System (DIRS) when the Commission activates DIRS in geographic areas in which they provide service, even when their reportable infrastructure has not changed compared to the prior day."
    page: 40
    clause: "Appendix A, 47 CFR § 4.18(a)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: global_example
    why: "Transitions DIRS from voluntary reporting to mandatory daily operational reporting during declared emergencies."
  - quote: "provide a single, final report to the Commission within 24 hours of the Commission’s deactivation of DIRS and the termination of required daily reporting, detailing the state of their infrastructure at the time of DIRS deactivation and an estimated date of resolution of any remaining outages."
    page: 40
    clause: "Appendix A, 47 CFR § 4.18(a)(2)"
    topic: disaster_coordination
    gap: GAP-IN-01
    supports: global_example
    why: "Requires comprehensive final post-disaster infrastructure recovery report within 24 hours of DIRS deactivation."
  - quote: "Cable Communications, Wireline, Wireless, and Interconnected VoIP providers who provide a DIRS report pursuant to paragraph (a) of this section are not required to make submissions in the Network Outage Reporting System (NORS) under this chapter pertaining to any incidents arising during the DIRS activation and that are timely reported in DIRS."
    page: 40
    clause: "Appendix A, 47 CFR § 4.18(b)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: global_example
    why: "Codifies regulatory de-duplication exempting providers from duplicate NORS filings for incidents reported in DIRS."
