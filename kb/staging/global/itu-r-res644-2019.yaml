candidate_quotes:
- quote: that in times of disasters, if most terrestrial-based networks are destroyed or impaired, amateur, satellite and
    other non-ground-based networks may be available to provide communication services to assist in PPDR efforts;
  page: 565
  clause: Resolution 646 (Rev. WRC-19) considering m)
  topic: emergency_powers
  gap: GAP-IN-07
  supports: global_example
  why: Recognizes the role of satellite and non-terrestrial networks as critical failover communication paths when ground
    networks are impaired.
- quote: that natural disasters have underscored the importance of utilizing effective measures to mitigate their effects,
    including prediction, detection and alerting through coordinated and effective use of the radio-frequency spectrum;
  page: 569
  clause: Resolution 647 (Rev. WRC-19) considering a)
  topic: downstream_warning
  gap: GAP-IN-02
  supports: global_example
  why: Affirms that early warning alerting requires coordinated spectrum allocation and management.
- quote: that there is a critical requirement to perform immediate spectrum-management actions, including frequency coordination,
    sharing and spectrum reuse, within a disaster area;
  page: 571
  clause: Resolution 647 (Rev. WRC-19) noting c)
  topic: emergency_powers
  gap: GAP-IN-07
  supports: global_example
  why: Mandates dynamic spectrum management actions and frequency reuse within disaster zones.
verified: false
notes: Target list cited Resolution 644 (Rev. WRC-19) with a URL resolving to Resolution 654 (WRC-12 automotive radar); Resolution
