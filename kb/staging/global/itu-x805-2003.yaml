candidate_quotes:
  - quote: "A security dimension is a set of security measures designed to address a particular aspect of the network security. This Recommendation identifies eight such sets that protect against all major security threats."
    page: 9
    clause: "Section 6"
    topic: standards
    gap: GAP-IN-06
    supports: global_example
    why: "Introduces the eight fundamental security dimensions of the ITU-T end-to-end security architecture."
  - quote: "The communication security dimension ensures that information flows only between the authorized end points (the information is not diverted or intercepted as it flows between these end points)."
    page: 9
    clause: "Section 6.5"
    topic: signalling_security
    gap: GAP-IN-08
    supports: global_example
    why: "Defines communications security preventing diversion, interception, or unauthorized tap of signaling and user traffic."
  - quote: "The availability security dimension ensures that there is no denial of authorized access to network elements, stored information, information flows, services and applications due to events impacting the network."
    page: 10
    clause: "Section 6.7"
    topic: failover_path_security
    gap: GAP-IN-08
    supports: global_example
    why: "Mandates availability safeguards preventing denial-of-service and preserving access across impacted network links."
verified: false
notes: "Foundational ITU-T security reference architecture defining the 3 layers, 3 planes, and 8 security dimensions."
