candidate_quotes:
  - quote: "International telecommunication services must give absolute priority to all telecommunications concerning safety of life at sea, on land, in the air or in outer space, as well as to epidemiological telecommunications of exceptional urgency of the World Health Organization."
    page: 84
    clause: "Article 40, Provision 191"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Top-level international treaty requirement giving absolute preemption and capacity priority to safety-of-life communications, including in outer space."
  - quote: "Subject to the provisions of Articles 40 and 46 of this Constitution, government telecommunications (see Annex to this Constitution, No. 1014) shall enjoy priority over other telecommunications to the extent practicable upon specific request by the originator."
    page: 85
    clause: "Article 41, Provision 192"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Subordinates government traffic priority to safety-of-life telecommunications while maintaining preemption over commercial traffic."
  - quote: "Radio stations shall be obliged to accept, with absolute priority, distress calls and messages regardless of their origin, to reply in the same manner to such messages, and immediately to take such action in regard thereto as may be required."
    page: 88
    clause: "Article 46, Provision 200"
    topic: emergency_powers
    gap: GAP-IN-03
    supports: global_example
    why: "Obligates radio stations to accept distress traffic with absolute priority regardless of origin or network boundaries."
verified: false
notes: "Foundational ITU constitutional treaty provisions establishing mandatory international priority for safety-of-life and distress traffic."
