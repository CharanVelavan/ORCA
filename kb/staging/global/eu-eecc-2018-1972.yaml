candidate_quotes:
- quote: Member States shall take all necessary measures to ensure the fullest possible availability of voice communications
    services and internet access services provided over public electronic communications networks in the event of catastrophic
    network breakdown or in cases of force majeure.
  page: 146
  clause: Article 108
  topic: disaster_coordination
  gap: GAP-IN-03
  supports: global_example
  why: Mandates Member States ensure maximum possible availability of voice and internet services during catastrophic network
    failures.
- quote: Member States shall ensure that providers of voice communications services take all necessary measures to ensure
    uninterrupted access to emergency services and uninterrupted transmission of public warnings.
  page: 146
  clause: Article 108
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Prioritizes uninterrupted access to emergency services and emergency public warning transmissions during breakdowns.
- quote: Member States shall ensure that, when public warning systems regarding imminent or developing major emergencies and
    disasters are in place, public warnings are transmitted by providers of mobile number-based interpersonal communications
    services to the end-users concerned.
  page: 148
  clause: Article 110(1)
  topic: downstream_warning
  gap: GAP-IN-02
  supports: global_example
  why: Requires mobile providers to transmit emergency warnings to end-users in disaster situations.
verified: false
notes: European Electronic Communications Code provisions governing network breakdown resilience, priority access to emergency
  services, and public warning systems.
