candidate_quotes:
- quote: To ensure the continuity of operations, critical entities are encouraged to consider redundancy measures ensuring
    that essential services continue to be provided when primary systems fail.
  page: 10
  clause: Paragraph 66
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Recommends redundancy measures to ensure continuity of essential services during primary system failures.
- quote: Such measures may include identifying which specific sub-services are most critical so that they are the first to
    be restored (service prioritisation), maintaining the ability to operate hardware manually if the automated or AI-driven
    systems fail or are tampered with, and workforce recovery in case of a disruptive incident.
  page: 10
  clause: Paragraph 66
  topic: capacity_priority
  gap: GAP-IN-03
  supports: global_example
  why: Explicitly recommends service prioritization ladders and maintaining manual overrides when automated or AI-driven systems
    fail.
- quote: Alternative sites for disaster recovery can be hot sites (fully equipped for immediate use), warm sites (partially
    equipped), or cold sites (requiring post-disruption setup).
  page: 10
  clause: Paragraph 67
  topic: failover_path_security
  gap: GAP-IN-08
  supports: global_example
  why: Provides guidance on disaster recovery alternative sites including hot, warm, and cold backup locations.
