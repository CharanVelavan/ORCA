  - quote: "A manufacturer shall notify any actively exploited vulnerability contained in the product with digital elements that it becomes aware of simultaneously to the CSIRT designated as coordinator, in accordance with paragraph 7 of this Article, and to ENISA."
    page: 38
    clause: "Article 14(1)"
    topic: telecom_cyber_security
    gap: GAP-IN-01
    supports: global_example
    why: "Requires manufacturers of digital products to notify actively exploited vulnerabilities simultaneously to national CSIRTs and ENISA."
  - quote: "an early warning notification of an actively exploited vulnerability, without undue delay and in any event within 24 hours of the manufacturer becoming aware of it, indicating, where applicable, the Member States on the territory of which the manufacturer is aware that their product with digital elements has been made available;"
    page: 38
    clause: "Article 14(2)(a)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: global_example
    why: "Establishes a 24-hour mandatory early warning deadline for actively exploited vulnerabilities in digital devices and software."
  - quote: "A manufacturer shall notify any severe incident having an impact on the security of the product with digital elements that it becomes aware of simultaneously to the CSIRT designated as coordinator, in accordance with paragraph 7 of this Article, and to ENISA."
    page: 39
    clause: "Article 14(3)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: global_example
    why: "Mandates reporting of severe security incidents impacting products with digital elements to CSIRTs and ENISA."
