candidate_quotes:
  - quote: "The primary goal for IEPS is to support crisis management arrangements. IEPS should significantly increase the ability of IEPS users to initiate and complete their communications (voice and data) via the PSTN, ISDN or PLMN irrespective of the bearer technology."
    page: 7
    clause: "Clause 5"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Establishes bearer-independent preferential access for crisis management and emergency personnel across communication networks."
  - quote: "Calls originated by IEPS users should be given priority through the networks involved when IEPS is enabled."
    page: 8
    clause: "Clause 5"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Mandates queue and bandwidth prioritization for emergency priority scheme calls during disaster congestion."
  - quote: "In order to ensure that an IEPS user can reliably call any other telecommunications user, any restrictions to call completion should be overridden. This does not include pre-emption of any existing calls."
    page: 8
    clause: "Clause 5"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: global_example
    why: "Overrides network congestion throttling and call completion blocks for registered emergency priority callers."
verified: false
notes: "International standard establishing technical mechanisms for priority telecommunication treatment during disaster operations."
