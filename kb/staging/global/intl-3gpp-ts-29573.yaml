candidate_quotes:
  - quote: "The N32-f interface shall be used to forward the HTTP/2 messages of the NF service producers and the NF service consumers in different PLMN, through the SEPPs of the respective PLMN."
    page: 3
    clause: "4.2.3"
    topic: signalling_security
    gap: null
    supports: context
    why: "Specifies inter-PLMN signaling message forwarding through Security Edge Protection Proxies (SEPP)."
  - quote: "For the security protection at the transport layer, the SEPPs shall support TLS as specified in clause 13.1.2 of 3GPP TS 33.501 [6]."
    page: 3
    clause: "4.3.1"
    topic: signalling_security
    gap: null
    supports: context
    why: "Mandates TLS support at the transport layer for secure inter-PLMN interconnect between SEPPs."
  - quote: "When the receiving SEPP receives HTTP requests over N32-f with purpose, marked using 3gpp-Sbi-Interplmn-Purpose header as specified in 3GPP TS 29.500 [4], that does not match with any of the purposes exchanged via the Security Capability Negotiation procedure, then the \"cause\" attribute shall be set to \"REQUESTED_PURPOSE_NOT_ALLOWED\"."
    page: 3
    clause: "6.1.7"
    topic: signalling_security
    gap: null
    supports: context
    why: "Requires rejection of inter-PLMN requests whose purpose does not match negotiated security capabilities."
