  - quote: "Recognizing that transmissions on distress and safety frequencies and frequencies used for the safety and regularity of flight (see Article 31 and Appendix 27) require absolute international protection and that the elimination of harmful interference to such transmissions is imperative, administrations undertake to act immediately when their attention is drawn to any such harmful interference. (WRC-07)"
    page: 263
    clause: "Article 15, No. 15.28 § 20"
    topic: emergency_powers
    gap: GAP-IN-06
    supports: global_example
    why: "Mandates immediate sovereign state action to eliminate harmful interference on safety-of-life and flight frequencies."
  - quote: "It is essential that Member States exercise the utmost goodwill and mutual assistance in the application of the provisions of Article 45 of the Constitution and of this Section to the settlement of problems of harmful interference."
    page: 263
