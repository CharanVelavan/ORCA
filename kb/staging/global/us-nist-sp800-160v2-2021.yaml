  - quote: "The four cyber resiliency goals, which are common to many resilience definitions, are included in the definition and the cyber resiliency engineering framework to provide linkage between risk management decisions at the system level, the mission and business process level, and the organizational level."
    page: 25
    clause: "Section 2.1.1"
    topic: standards
    gap: GAP-IN-08
    supports: global_example
    why: "Links high-level organizational cyber resiliency goals (anticipate, withstand, recover, adapt) directly to engineering architecture."
  - quote: "Adverse conditions can include natural disasters and structural failures (e.g., power failures). Stresses can include unexpectedly high-performance loads."
    page: 26
    clause: "Section 2.1.1 (Table 2)"
    topic: backup_power
    gap: GAP-IN-08
    supports: global_example
    why: "Explicitly includes structural grid power failures and disaster stresses within the scope of cyber-resiliency adversity."
  - quote: "The following 14 techniques are part of the cyber resiliency engineering framework: 1. Adaptive Response: Implement agile courses of action to manage risks. 2. Analytic Monitoring: Monitor and analyze a wide range of properties and behaviors on an ongoing basis and in a coordinated way."
    page: 29
    clause: "Section 2.1.3"
    topic: failover_path_security
    gap: GAP-IN-08
    supports: global_example
    why: "Details standard systems security engineering techniques for active failover, dynamic response, and coordinated monitoring."
