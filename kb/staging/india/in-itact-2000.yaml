candidate_quotes:
  - quote: "The appropriate Government may, by notification in the Official Gazette, declare any computer resource which directly or indirectly affects the facility of Critical Information Infrastructure, to be a protected system."
    page: 29
    clause: "Section 70(1)"
    topic: critical_infrastructure
    gap: GAP-IN-06
    supports: answers_gap
    why: "Empowers the government to declare computer resources affecting critical information infrastructure as protected systems."
  - quote: "The Central Government may, by notification published in the Official Gazette, designate any organisation of the Government as the national nodal agency in respect of Critical Information Infrastructure Protection."
    page: 29
    clause: "Section 70A(1)"
    topic: critical_infrastructure
    gap: GAP-IN-06
    supports: answers_gap
    why: "Provides statutory foundation for designating NCIIPC as the national nodal agency for critical information infrastructure protection."
  - quote: "The Indian Computer Emergency Response Team shall serve as the national agency for performing the following functions in the area of cyber security,–"
    page: 30
    clause: "Section 70B(4)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: answers_gap
    why: "Establishes CERT-In as the statutory national agency for cyber incident response, alerts, emergency measures and coordination."
  - quote: "For carrying out the provisions of sub-section (4), the agency referred to in sub-section (1) may call for information and give direction to the service providers, intermediaries, data centres, body corporate and any other person."
    page: 30
    clause: "Section 70B(6)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: answers_gap
    why: "Statutory authority for CERT-In to call for information and issue binding directions to service providers, data centres and bodies corporate."
