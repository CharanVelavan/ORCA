notes: "Read by keyword and clause check. The list's binding label is supported by the 'hereby makes' wording. The file covers miscellaneous telecom services, including trusted sources (rule 36 in the file text) and satellite connectivity for aircraft and ships. The gateway duty is in the satellite part of the file. No GAP is linked here; these are context and comparison points for GAP-IN-08 and GAP-IN-09. Quotes are verbatim and checked."
