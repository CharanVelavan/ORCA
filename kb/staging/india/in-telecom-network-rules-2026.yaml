  - quote: "Every new authorised entity shall for the purposes of disaster management, ensuring public safety or providing response to an emergency or a disaster as defined under the Disaster Management Act, 2005 (53 of 2005), adhere to such directions or guidelines issued by the Central Government in this regard."
    page: 40
    clause: "Rule 24(10)"
    topic: disaster_coordination
    gap: GAP-IN-08
    supports: proves_gap
    why: "Mandates adherence to disaster management and emergency response directions issued by the Central Government."
  - quote: "Every new authorised entity shall ensure that all systems of its telecommunication network and the data, logs and information associated with its telecommunication network shall be stored within India and no copies of such data, logs and information shall be routed, shared or made available outside India."
    page: 40
    clause: "Rule 25(3)"
    topic: data_location
    gap: GAP-IN-06
    supports: proves_gap
    why: "Enforces strict data sovereignty requiring all network systems, logs, and information to be stored within India without foreign routing."
  - quote: "Satellite earth station gateway provider authorisation consists of authorisation to establish, operate, maintain or expand the satellite earth station gateway for such satellite or space segment capacity which is authorised by the Department of Space in the Government of India, or any other designated agency specified for this purpose."
    page: 46
    clause: "Rule 50(1)"
    topic: space_cyber
    gap: GAP-IN-06
    supports: proves_gap
    why: "Defines authorisation conditions for satellite earth station gateways linked to Department of Space approvals."
