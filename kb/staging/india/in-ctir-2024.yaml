candidate_quotes:
- quote: Every telecommunication entity shall ensure that Critical Telecommunication Infrastructure, including any spares,
    hardware and software used in such Critical Telecommunication Infrastructure, are in compliance with the following standards,
    namely:–
  page: 7
  clause: Rule 4
  topic: standards
  gap: GAP-IN-06
  supports: answers_gap
  why: Mandates that Critical Telecommunication Infrastructure and components comply with notified standards including ERs
    and ITSARs.
- quote: implement mechanisms to ensure intimation of security incident(s) to the Central Government, no later than six hours
    of occurrence of such incident, in the form and manner as may be specified on the portal; and
  page: 8
  clause: Rule 7(1)(j)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: proves_gap
  why: Prescribes a six-hour security incident intimation clock to the Central Government for incidents affecting Critical
    Telecommunication Infrastructure.
- quote: preserve in a secure manner, for a minimum period of two years or such other period as may be determined by the Central
    Government, logs and documentation of the telecommunication network architecture of Critical Telecommunication Infrastructure,
    including changes in such telecommunication network architecture;
  page: 8
  clause: Rule 7(1)(c)
  topic: log_retention
  gap: null
  supports: context
  why: Imposes a minimum two-year log and architecture documentation preservation requirement for Critical Telecommunication
    Infrastructure.
- quote: implement standard operating procedures for security incident response systems, including disaster recovery and business
    continuity;
  page: 8
  clause: Rule 7(1)(i)
  topic: disaster_coordination
  gap: GAP-IN-08
  supports: answers_gap
  why: Requires covered telecommunication entities to implement SOPs for security incident response, disaster recovery and
    business continuity.
verified: false
notes: Notified under G.S.R. 723(E), 22 Nov 2024. Implements IT/telecom critical infrastructure obligations under Section
  22(4) of the Telecommunications Act 2023.
