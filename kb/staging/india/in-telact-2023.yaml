candidate_quotes:
  - quote: "provide for appropriate mechanism to ensure that messages of a user or group of users authorised for response and recovery during public emergency are routed on priority."
    page: 9
    clause: "Section 20(1)(b)"
    topic: capacity_priority
    gap: GAP-IN-03
    supports: proves_gap
    why: "Empowers the government to ensure priority message routing for authorized response users during emergencies, but establishes no automatic multi-tier capacity priority rule across dependent sectors."
  - quote: "take temporary possession of any telecommunication service or telecommunication network from an authorised entity;"
    page: 9
    clause: "Section 20(1)(a)"
    topic: emergency_powers
    gap: GAP-IN-03
    supports: answers_gap
    why: "Provides statutory emergency power to temporarily take possession of telecommunication services or networks during public emergency."
  - quote: "The Central Government may by rules provide for the standards, security practices, upgradation requirements and procedures to be implemented for such Critical Telecommunication Infrastructure."
    page: 10
    clause: "Section 22(4)"
    topic: standards
    gap: GAP-IN-06
    supports: proves_gap
    why: "Authorizes the Central Government to prescribe rules for standards, security practices and upgradation requirements for Critical Telecommunication Infrastructure."
  - quote: "The Central Government may, by notification in the Official Gazette, declare any telecommunication network, or part thereof, as Critical Telecommunication Infrastructure, disruption of which shall have debilitating impact on national security, economy, public health or safety."
    page: 10
    clause: "Section 22(3)"
    topic: critical_infrastructure
    gap: GAP-IN-06
    supports: answers_gap
    why: "Authorizes the Central Government to notify telecommunication networks or parts thereof as Critical Telecommunication Infrastructure."
