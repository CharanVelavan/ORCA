candidate_quotes:
  - quote: "National Critical Information Infrastructure Protection Centre (hereinafter referred to as NCIIPC) shall be the national nodal agency designated under section 70A of the Act in respect of Critical Information Infrastructure Protection and shall function at the address to be notified."
    page: 3
    clause: "Rule 3(1)"
    topic: critical_infrastructure
    gap: GAP-IN-06
    supports: answers_gap
    why: "Designates NCIIPC as the national nodal agency under Section 70A of the Information Technology Act for Critical Information Infrastructure protection."
  - quote: "Coordinating, sharing, monitoring, collecting, analysing and forecasting, national-level threats to critical information infrastructure for policy guidance, expertise-sharing and situational awareness for early warning or alerts."
    page: 3
    clause: "Rule 4(5)"
    topic: downstream_warning
    gap: GAP-IN-02
    supports: answers_gap
    why: "Assigns NCIIPC responsibility for threat monitoring, analysis and early warning dissemination across critical infrastructure."
  - quote: "Exchanging cyber incidents and other information relating to attacks and vulnerabilities with Indian Computer Emergency Response Team and other concerned organisations in the field."
    page: 4
    clause: "Rule 4(12)"
    topic: disaster_coordination
    gap: GAP-IN-01
    supports: answers_gap
    why: "Mandates institutional cyber incident and vulnerability exchange between NCIIPC and CERT-In."
  - quote: "In the event of any threat to critical information infrastructure the National Critical Information Infrastructure Protection Centre may call for information and give directions to the critical sectors or persons serving or having a critical impact on Critical Information Infrastructure."
    page: 4
    clause: "Rule 4(13)"
    topic: emergency_powers
    gap: GAP-IN-06
    supports: answers_gap
    why: "Empowers NCIIPC to call for information and give directions to critical sectors during threats to critical information infrastructure."
