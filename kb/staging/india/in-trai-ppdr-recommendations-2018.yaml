notes: "TRAI recommendations on PPDR communications (advisory, 52 pages). Disaster and emergency communications are the core topic. The 2018 text predates the 2023 Act. The gap field lists GAP-IN-05 by mistake from the list and is not linked to the quote; GAP-IN-05 concerns breach clocks, which PPDR does not address. The quote is paragraph 2.50 (page break inside it). A later sentence in the same section says a satellite backup network was already in place; it is not quoted here because it needs context."
