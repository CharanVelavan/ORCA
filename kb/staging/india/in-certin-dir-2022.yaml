candidate_quotes:
  - quote: "Any service provider, intermediary, data centre, body corporate and Government organisation shall mandatorily report cyber incidents as mentioned in Annexure I to CERT-In within 6 hours of noticing such incidents or being brought to notice about such incidents."
    page: 2
    clause: "(ii)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: proves_gap
    why: "Mandates reporting of listed incidents within 6 hours of noticing or being informed, with no separate trigger for suspected incidents or backhaul outages."
  - quote: "The service providers, intermediaries, data centres, body corporate and Government organisations shall designate a Point of Contact to interface with CERT-In."
    page: 3
    clause: "(iii)"
    topic: incident_reporting
    gap: GAP-IN-01
    supports: answers_gap
    why: "Requires covered entities to designate a dedicated Point of Contact for reporting and compliance communications with CERT-In."
  - quote: "All service providers, intermediaries, data centres, body corporate and Government organisations shall mandatorily enable logs of all their ICT systems and maintain them securely for a rolling period of 180 days and the same shall be maintained within the Indian jurisdiction."
    page: 3
    clause: "(iv)"
    topic: log_retention
    gap: null
    supports: context
    why: "Mandates rolling 180-day retention of ICT system logs within Indian jurisdiction."
  - quote: "Attacks on Critical infrastructure, SCADA and operational technology systems and Wireless networks"
    page: 5
    clause: "Annexure I (ix)"
    topic: critical_infrastructure
    gap: null
    supports: context
    why: "Classifies attacks on critical infrastructure and wireless networks as mandatorily reportable cyber security incidents."
