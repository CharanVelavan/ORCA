notes: "The list calls this the Telecommunications (Right of Terminal Redirection) Rules, 2025. That is wrong. The document is radio telephone operator certification under the Bharatiya Vayuyan Adhiniyam, 2024 (aviation), with no terminal redirection, routing or cyber-event content. The list's why field is also not supported. No candidate quotes. The title above is from the text and the list's title is not used."
