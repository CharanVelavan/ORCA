candidate_quotes:
- quote: These rules may be called the Telecommunications (Framework to Notify Standards, Conformity Assessment and Certification)
    Rules, 2025.
  page: 6
  clause: Rule 1(1)
  topic: standards
  gap: GAP-IN-06
  supports: answers_gap
  why: Promulgates the framework rules for notifying telecommunication standards, conformity assessment and equipment certification
    under Section 19.
- quote: No telecommunication equipment to which a standard applies, shall be sold or deployed in any telecommunication network,
    or otherwise be used in India, unless it has a valid Certificate of Conformity Assessment.
  page: 8
  clause: Rule 8(2)
  topic: standards
  gap: GAP-IN-06
  supports: answers_gap
  why: Mandates that no telecommunication equipment subject to standards may be sold, deployed or used in India without valid
    certification.
- quote: An authorised entity or a licensee shall, upon becoming aware that a user of its telecommunication services is using
    telecommunication equipment that does not have a valid Certificate of Conformity Assessment, issue a notice in writing
    to such user seeking discontinuance by the user of such telecommunication equipment within a period of seven days from
    the date of issuance of the notice.
  page: 9
  clause: Rule 10(1)
  topic: downstream_warning
  gap: GAP-IN-02
  supports: answers_gap
  why: Requires licensees to serve written notice requiring discontinuance within seven days upon discovering uncertified
    equipment.
- quote: Where a user, upon receipt of a notice under sub-rule (1), does not discontinue the use of the uncertified telecommunication
    equipment within seven days from the date of issuance of such notice, the authorised entity or licensee, shall suspend
    the telecommunication service or connectivity to the telecommunication network of such user and inform the Central Government
    in writing of such discontinuance.
  page: 9
  clause: Rule 10(2)
  topic: emergency_powers
  gap: GAP-IN-06
  supports: answers_gap
  why: Directs service suspension for persistent operation of uncertified telecommunication equipment and written notification
    to the Central Government.
verified: false
notes: Notified vide G.S.R. 315(E) on 16 May 2025 under Section 19 read with Section 56(2)(zj) of the Telecommunications Act
