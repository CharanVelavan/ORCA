candidate_quotes:
  - quote: "These rules may be called the Indian Telegraph Right of Way (Amendment) Rules, 2023."
    page: 4
    clause: "Rule 1(1)"
    topic: critical_infrastructure
    gap: GAP-IN-04
    supports: context
    why: "Defines the short title for the 2023 right of way amendment rules."
  - quote: "In case of damage of any existing underground telegraph infrastructure for any reason, the licensee, whose existing underground telegraph infrastructure is damaged, may temporarily establish the overground telegraph infrastructure, in lieu of the damaged underground telegraph infrastructure, to restore the telegraph service for the period of sixty days from the date of reporting of damage of the infrastructure to the appropriate authority."
    page: 4
    clause: "Rule 2 (Rule 9A(1))"
    topic: critical_infrastructure
    gap: GAP-IN-04
    supports: proves_gap
    why: "Permits temporary establishment of overground telegraph infrastructure for 60 days to restore damaged underground services."
  - quote: "No fee or compensation shall be charged by the appropriate authority for the establishment of temporary overground telegraph infrastructure under this rule"
    page: 4
    clause: "Rule 2 (Rule 9A(2))"
    topic: critical_infrastructure
    gap: GAP-IN-04
    supports: proves_gap
    why: "Exempts temporary overground restoration infrastructure from fees or compensation."
  - quote: "The appropriate central authorities shall permit deployment of small cells and shall charge no administrative fees or compensation for deployment of small cells on buildings and structures vested in or under their control as per Part-I or Part-III of the Schedule:"
    page: 5
    clause: "Rule 4(b) (Rule 10A(5))"
    topic: critical_infrastructure
    gap: GAP-IN-04
    supports: proves_gap
    why: "Mandates central authorities to permit small cell deployments without administrative fees on buildings under their control."
