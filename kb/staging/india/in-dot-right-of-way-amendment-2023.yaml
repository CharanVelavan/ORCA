binding_basis: "In exercise of the powers conferred by sub-section (1) and clause (e) of sub-section (2) of section 7 read with sections 10, 12 and 15 of the Indian Telegraph Act, 1885(13 of 1885), the Central Government hereby makes the following rules further to amend the Indian Telegraph Right of Way Rules, 2016"
