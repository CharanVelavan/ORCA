- quote: A state/UT Public Safety Answering Point (PSAP) is the State/UT call centre responsible for answering calls to an
    emergency telephone number for police, firefighting, ambulance and other services.
  page: 4
  clause: Section 2, Clause 1
  topic: disaster_coordination
  gap: GAP-IN-03
  supports: answers_gap
  why: Defines the 24/7 operating model of State/UT Public Safety Answering Points (PSAPs) receiving and dispatching multi-service
    emergency requests.
- quote: In case of special requirement of the State/UT to scale up, such as religious gathering, natural disaster or any
    such unforeseen event, the State/UT may partner with neighboring State/UTs to attend to the incoming calls from distressed
    citizens.
  page: 24
  clause: Section 9, Clause 2
  topic: disaster_coordination
  gap: GAP-IN-03
