candidate_quotes:
- quote: The Licensee shall also facilitate the priority routing of emergency/public utility or any other type of user calls
    as per guidelines /directions as may be prescribed by Licensor.
  page: 29
  clause: Part I, Condition 28
  topic: capacity_priority
  gap: GAP-IN-03
  supports: proves_gap
  why: Requires licensees to facilitate priority routing of emergency calls as directed, but leaves specific multi-sector
    priority ladders for scarce backup bandwidth unspecified.
- quote: The operation and maintenance centre of the GMPCS Gateway shall also be located in India.
  page: 107
  clause: Chapter XII, Condition 7.1
  topic: data_location
  gap: GAP-IN-08
  supports: answers_gap
  why: Mandates that the operation and maintenance centre of the satellite (GMPCS) gateway be physically located in India.
- quote: All calls originating or terminating from Mobile Terminals in India shall pass through the GMPCS Gateway Switch located
    in India.
  page: 110
  clause: Chapter XII, Condition 7.15
  topic: data_location
  gap: GAP-IN-08
  supports: answers_gap
  why: Mandates that all satellite communication traffic originating or terminating in India must traverse an Indian-located
    gateway switch.
- quote: Domestic traffic should not be hauled/ routed to any place outside India.
  page: 110
  clause: Chapter XII, Condition 7.15
  topic: failover_path_security
  gap: GAP-IN-08
  supports: answers_gap
  why: Prohibits routing or hauling domestic Indian traffic outside India, establishing a critical routing constraint for
    NTN failover.
