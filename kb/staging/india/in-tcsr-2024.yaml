candidate_quotes:
- quote: within six hours of becoming aware of a security incident affecting its telecommunication network or telecommunication
    service, report the same to the Central Government with relevant details of the affected system including the description
    of such incident;
  page: 5
  clause: Rule 7(1)(a)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: proves_gap
  why: Imposes a six-hour security incident reporting duty to the Central Government upon becoming aware of an incident affecting
    telecom networks or services.
- quote: 'within twenty-four hours of becoming aware of such incident, furnish the following information, as applicable:'
  page: 5
  clause: Rule 7(1)(b)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: answers_gap
  why: Requires detailed impact reporting within 24 hours regarding affected users, duration, geographical area and remedial
    measures.
- quote: The Central Government may, where it determines that disclosure of the security incident is in the public interest,
    inform the public of such security incident, or require the affected telecommunication entity to do so.
  page: 5
  clause: Rule 7(2)
  topic: downstream_warning
  gap: GAP-IN-02
  supports: proves_gap
  why: Public disclosure of incidents is at the discretion of the Central Government, proving the lack of a mandatory operator
    duty to warn downstream dependent services.
- quote: Every telecommunication entity shall appoint a Chief Telecommunication Security Officer, whose details shall be provided
    in writing to the Central Government in the form as may be specified on the portal and any replacement or change of such
    officer shall be promptly intimated to the Central Government, in such form as may be specified on the portal by that
    Government.
  page: 5
  clause: Rule 6(1)
  topic: telecom_cyber_security
  gap: null
  supports: context
  why: Mandates appointment of a Chief Telecommunication Security Officer responsible for coordinating cybersecurity implementation
    and incident reporting.
