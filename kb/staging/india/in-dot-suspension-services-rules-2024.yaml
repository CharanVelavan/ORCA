candidate_quotes:
  - quote: "The directions to suspend any telecommunication service or any class of telecommunication services under clause (b) of sub-section (2) of section 20, shall only be issued by suspension order, and for reasons to be recorded in writing by a competent authority:"
    page: 4
    clause: "Rule 3(1)"
    topic: emergency_powers
    gap: null
    supports: context
    why: "Sets the legal test for any shutdown or suspension of telecom service: a written suspension order with reasons from a competent authority, which an NTN outage response must follow."
  - quote: "to its confirmation by the competent authority, within twenty-four hours of issuance of such order, failing which the suspension order shall cease to exist."
    page: 4
    clause: "Rule 3(1), second proviso"
    topic: emergency_powers
    gap: null
    supports: context
    why: "An emergency suspension by a delegated officer lapses unless the competent authority confirms it within 24 hours, a time limit an incident playbook must respect."
  - quote: "A copy of the suspension order issued under sub-rule (1) shall be forwarded to the concerned review committee within a period of twenty-four hours from the issuance of such order."
    page: 5
    clause: "Rule 3(3)"
    topic: emergency_powers
    gap: null
    supports: context
    why: "Requires oversight by a review committee within 24 hours of any suspension order, a check on emergency shutdowns."
verified: false
notes: "Read in full (keyword check). Replaces the 2017 suspension rules for emergency shutdowns under section 20 of the Telecommunications Act, 2023. It covers suspension of services (for example, a whole-network shutdown), not hybrid failover, so no gap is linked. The list's binding label is confirmed by the notification's own wording."
