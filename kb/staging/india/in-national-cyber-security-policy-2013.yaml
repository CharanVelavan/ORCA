- quote: To build a secure and resilient cyberspace for citizens, businesses and Government
  page: 3
  clause: Section I (Vision)
  topic: telecom_cyber_security
  gap: GAP-IN-06
  supports: context
  why: Articulates the overarching national vision for building a secure and resilient cyberspace.
- quote: To enable implementation of global security best practices in formal risk assessment and risk management processes,
    business continuity management and cyber crisis management plan by all entities within Government and in critical sectors,
    to reduce the risk of disruption and improve the security posture.
  page: 5
  clause: Strategy B(3)
  topic: critical_infrastructure
  gap: GAP-IN-08
  supports: proves_gap
  why: Mandates formal risk assessment, business continuity management, and cyber crisis management plans in critical sectors.
- quote: To mandate periodic audit and evaluation of the adequacy and effectiveness of security of information infrastructure
    as may be appropriate, with respect to regulatory framework.
  page: 6
  clause: Strategy D(2)
  topic: standards
  gap: GAP-IN-06
  supports: proves_gap
  why: Requires periodic audit and evaluation of information infrastructure security against regulatory frameworks.
- quote: To operate a 24x7 National Level Computer Emergency Response Team (CERT-In) to function as a Nodal Agency for coordination
    of all efforts for cyber security emergency response and crisis management.
  page: 6
  clause: Strategy E(2)
  topic: incident_reporting
  gap: GAP-IN-01
  supports: proves_gap
  why: Designates CERT-In as the 24x7 national nodal agency for cybersecurity incident response and crisis management.
