notes: "The list says this amends incident reporting workflows and technical standards via the ICDR portal. Keyword search found no change to incident-reporting clocks or to ICDR. The amendment adds a mobile number validation platform (Rule 7A) and emergency identifier suspension (Rule 7(6)). It also says the rules come into force on publication in the Official Gazette. The list's why field is not supported. The 2024 Telecom Cyber Security Rules (Rule 7(1)(a), six-hour clock) are not amended here. Quotes are context only; no gap is proved."
