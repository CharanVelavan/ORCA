notes: "This is a 2024 Unified License Agreement (176 pages). The A-list entry in-dot-unified-licence is a different document (195 pages), so the two may be different versions and both are recorded. Clause numbers here are 10.4 to 10.5 and 29.6, not the Part I Condition 28 numbering in the other file. The licence's satellite (GMPCS) chapter is Chapter XII; not quoted here. The list's binding label is supported by the licence form ('between the President of India acting through' Department of Telecommunications; the file is a template with blanks)."
