candidate_quotes:
  - quote: "These rules may be called the Telecommunications (Procedures and Safeguards for Lawful Interception of Messages) Rules, 2024."
    page: 6
    clause: "Rule 1(1)"
    topic: emergency_powers
    gap: null
    supports: context
    why: "Enacts the statutory procedural rules and safeguards for lawful interception of messages under Section 20(2)(a)."
  - quote: "The Central Government may, by an order, specify one or more authorised agencies to intercept or receive any message or class of messages pursuant to an interception order, for the reasons specified under sub-section (2) of section 20 of the Act."
    page: 6
    clause: "Rule 3(1)"
    topic: emergency_powers
    gap: null
    supports: context
    why: "Authorizes designated law enforcement and security agencies to execute interception orders."
  - quote: "a copy of such interception order shall be submitted within three working days of the date of its issuance to the competent authority, and the competent authority shall, if it considers appropriate, confirm such order within a period of seven working days from the date of issue;"
    page: 7
    clause: "Rule 3(3)(a)"
    topic: emergency_powers
    gap: null
    supports: context
    why: "Establishes strict oversight and confirmation deadlines for emergency interception orders issued in operational circumstances."
  - quote: "In case of non-confirmation of interception orders by the competent authority under sub-rule (3), the same message or class of messages shall not be intercepted by the authorised agency, without an interception order by the competent authority."
    page: 7
    clause: "Rule 3(4)"
    topic: emergency_powers
    gap: null
    supports: context
    why: "Mandates cessation of interception and evidence destruction if emergency interception orders are not confirmed."
