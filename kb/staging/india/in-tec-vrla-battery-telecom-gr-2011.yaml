candidate_quotes:
- quote: 'Float and Cyclic Application: The batteries in Indian Telecom Network are used for Float and cyclic application
    depending upon the requirement and location. The battery may be required to provide a back-up between 6 to 72 hours.'
  clause: Clause 1.1.1.1
  topic: backup_power
  gap: GAP-IN-04
  supports: proves
  why: Recognizes site backup requirements ranging between 6 to 72 hours depending on location without establishing a mandatory
    statutory floor.
  page: 6
- quote: 'Float Application: The battery is normally not allowed to discharge beyond 80% of C (rated capacity of the battery
    at C/10 rate of discharge).'
  clause: Clause 1.1.1.1
  topic: backup_power
  gap: GAP-IN-04
  supports: context
  why: Specifies depth of discharge limit of 80 percent for float applications under C/10 discharge rates in Indian telecom
    networks.
  page: 6
verified: false
notes: Generic technical requirements for VRLA gel batteries in telecom; mentions 6-72 hour operational back-up ranges without
  mandating a binding site floor.
