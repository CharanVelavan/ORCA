    why: "Prescribes 1 January 2025 as the effective commencement date for the Right of Way Rules."
  - quote: "Where any damage is caused to any existing overground or underground telecommunication network, operated and maintained by a facility provider due to any reason, such facility provider may temporarily establish overground telecommunication network on the public property with a view to prompt restoration of the telecommunication service, by providing in writing, the details of the damage, through the portal, to the relevant public entity which has ownership, control or management over such public property:"
    page: 26
    clause: "Rule 10(1)"
    topic: disaster_coordination
    gap: GAP-IN-08
    supports: answers_gap
    why: "Permits emergency temporary deployment of overground networks on public property without prior consent to ensure prompt restoration."
  - quote: "The facility provider shall ensure restoration of the affected overground or underground telecommunication network within a period of sixty days, but no later than ninety days from the date of reporting of the damage to the public entity."
    page: 26
    clause: "Rule 10(2)"
    topic: disaster_coordination
    gap: GAP-IN-08
    supports: answers_gap
    why: "Mandates 60 to 90 day final restoration timeline following emergency temporary network establishment."
