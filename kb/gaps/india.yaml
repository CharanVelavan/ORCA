# each finding carries the dated, scoped claim.
#
# Glossary
#   NTN      non-terrestrial (satellite-backed) network          CERT-In  Indian Computer Emergency Response Team
#   DoT      Department of Telecommunications                    TRAI     Telecom Regulatory Authority of India
