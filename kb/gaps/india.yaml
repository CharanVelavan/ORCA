      quote: "The feeder link and the inter-satellite link (ISL) are assumed to act only as transport layer links and are not specified in 3GPP."
    why_not_covered: A 3GPP study report, not a specification, and it defers to generic IP security. Section 19 is a power to notify standards; the Authz Rules require conformity with notified standards, but none for satellite links was found. GMPCS Condition 41.7 (privacy of communication) sets an outcome, not a link standard.
  analysis:
    impact: Feeder links carry all user traffic between the ground and the satellite, yet no mobile-standards specification or notified Indian standard sets how they are secured.
