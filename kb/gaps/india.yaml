- id: GAP-IN-07-NO-JOINT-PLAN
  jurisdiction: IN
  kind: ambiguity
  topic: joint_command
  status: rejected
  title: Unclear who leads when one cyber incident spans satellite, telecom and power
  finding: CERT-In coordinates cyber-incident response and can give binding directions to service providers (IT Act s.70B(4)(d), 70B(6)). DoT's SOP makes DoT the lead agency for telecom in natural and manmade disasters, and operators "shall comply with the instructions of STDCC". These are separate chains, one under the IT Act and one under DoT's disaster SOP. No text was found in the sources we checked, as of 2026-11-07, that says which chain leads, or who decides, when one cyber incident hits a satellite operator, mobile operators and a power utility together.
  evidence: [IN-ITACT-2000-70B, IN-ITACT-2000-70B-4, IN-DOT-SOP-2017-2-3-2]
  affects: [satellite_operator, mobile_operator, power_utility, cert_in, dot]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["incident commander", "crisis management plan", "coordinat*", "lead agency", "committee", "nodal", "STDCC", "direction"]
    nearest_provision:
      source: in-itact-2000
      pinpoint: Section 70B(4)(d), PDF p. 30
      quote: "(d) coordination of cyber incidents response activities;"
    why_not_covered: Both chains exist and both can bind operators. Whether a cyber incident is a "disaster" for the SOP depends on the Disaster Management Act, which is not in our sources; the national Cyber Crisis Management Plan is not public. The gap is the missing tie-break, not a missing authority.
  analysis:
    impact: In a cross-sector cyber attack, two lawful chains can issue different instructions, and the operator does not know which one wins.
    affected: [satellite_operator, mobile_operator, power_utility]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: null
    owner: human_commander
    action: Name one human incident lead for the incident, record every instruction from either chain in one tamper-evident log.
  recommendation:
    regulator: [CERT-In, DoT]
    ask: State which chain leads a cross-sector NTN cyber incident, and how CERT-In directions and STDCC instructions are reconciled.
  verified: true
  verified_by: Charan Velavan, 2026-11-08 - REJECTED. Reason (reviewer) - general cross-sector cyber coordination, not specific to satellite networks; CERT-In can direct providers (IT Act s.70B(6)) and the IT Act overrides conflicting law (s.81, PDF p. 33). The satellite-specific part (advisory coordination text) is covered by GAP-IN-09.
  notes: Sweep SD-14, CL-30, CL-31. v3.2 reframed coverage -> ambiguity after Goldfish G1 round 2 (Blockers - s.70B(6) direction power; SOP covers manmade disasters). Not searched - Disaster Management Act 2005, national CCMP, NCIIPC rules; a human must check them before confirming. No comparison found in our KB.

- id: GAP-IN-08-NO-CLEAN-PATH-CHECK
  jurisdiction: IN
  kind: standards
  topic: failover_path_security
  status: confirmed
  title: Partial gap - no explicit check that the backup path is clean before failover during an attack
  finding: CTI owners must have disaster-recovery and business-continuity procedures (CTIR Rule 7(1)(i)). Satellite licensees may not fail over to gateways outside India (Authz Rule 60(1)(b)). The advisory space framework asks for failover mechanisms and for integrity checks before resuming operations after an incident. No rule or standard in the sources we checked requires the backup path to be verified uncompromised before traffic is moved during an attack, as of 2026-11-07, although jamming a link to force failover is a known attack path.
  evidence: [IN-CTIR-2024-R7-1-i, IN-AUTHZ-2026-R60-1, IN-SPACEFW-2026-7-3]
  affects: [mobile_operator, satellite_operator]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["failover", "fail-over", "redundan*", "alternate path|route|link|gateway", "backup link|path|network", "integrity before resumption", "business continuity", "failure of satellite earth station gateway"]
    nearest_provision:
      source: in-space-fw-2026
      pinpoint: §7.3 (Recovery), PDF p. 34
      quote: "Affected systems shall be restored to a verified secure state through re-imaging, patching, and validation of integrity before resumption of full operations."
    why_not_covered: The texts require continuity, limit where traffic may go, and (in advice) check integrity after an incident. None asks for a security check of the backup path at the moment of failover during an attack.
  analysis:
    impact: An attacker who jams the primary link can push traffic onto a path they already control.
    affected: [mobile_operator, critical_service_customer]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: PB-06
    owner: mobile_operator
    action: Check the backup path is clean before switching traffic to it, and never to a gateway outside India (Rule 60(1)(b)).
  recommendation:
    regulator: [DoT, TEC, ITU-T SG17]
    ask: A technical baseline that makes a clean-path check a precondition for failover on NTN backhaul.
  global_examples:
  - tier: auto_checked
    staged: us-fcc-911-reliability-2013
    jurisdiction: US
    instrument: Improving 911 Reliability; Reliability and Continuity of Communications Networks, Including Broadband Technologies (FCC 13-158)
    authority: Federal Communications Commission (FCC)
    clause: Appendix B, 47 CFR § 12.4(c)(1)(i)(C)
    page: 67
    binding_status: binding
    quote: Eliminated all single points of failure in Critical 911 Circuits or equivalent data paths serving each PSAP.
    shows: Path diversity for 911 circuits is required, but not an integrity check of the backup path.
    relation: same_gap_abroad
  - tier: verified
    record: EU-NIS2-2022-ART21-2-c
    jurisdiction: EU
    instrument: Directive (EU) 2022/2555 (NIS2)
    authority: European Parliament and Council
    clause: Article 21(2)(c)
    binding_status: binding
    quote: business continuity, such as backup management and disaster recovery, and crisis management;
    shows: Business continuity is required, but nothing says a failover path must be checked as clean first.
    relation: same_gap_abroad
  verified: true
  verified_by: Charan Velavan, 2026-11-08 - CONFIRMED AS PARTIAL. Continuity duties (CTIR 7(1)(i)) and the advisory secure-restoration line (space framework §7.3, p. 34) partly cover it; the gap is only the missing explicit pre-failover path check.
  notes: Sweep SD-10, CL-26, CL-27. A technical-baseline gap that ORCA-NTN's playbook PB-06 also fills; listed because the attack path is real and documented (jamming to force failover). Goldfish G3 (round 2) asked to park it as a playbook feature - contested, see goldfish-round2.md. No comparison found in our KB. v3.4 (8 Nov) - second-model (ChatGPT) review of staged quotes, docs/review/chatgpt_review_part*.md; the claim stays as worded (already scoped to an explicit/binding duty).

- id: GAP-IN-09-SPACE-CYBER-ADVISORY
  jurisdiction: IN
  kind: coverage
  topic: space_cyber
  status: confirmed
  title: No detailed, auditable satellite cyber baseline - one high-level IN-SPACe design line, and the space framework is advisory
  finding: For licensees under the 2026 Authorisation Rules ("new authorised entities"), binding general security duties apply (TCSR Rule 4; Authz Rule 54 network security and vendor checks, Rule 50 trusted sources, Rule 53 remote-access permission). Their satellite chapter (Authz Rules 59 to 62) adds interception, gateway location, terminal registration, rogue-signal and rogue-terminal reports, and interference monitoring and mitigation on direction (Rule 60(1)(f)). Older GMPCS licensees are bound by licence conditions instead. Satellite-specific cyber controls - protecting command and control links, key management, ground-segment segmentation, telemetry monitoring - appear only in the CERT-In / SIA-India framework, which PIB states is "advisory in nature". India's equipment security standards (NCCS ITSARs, issued under MTCTE) do require a dedicated management interface and secure VPNs - the two entry points of the 2022 KA-SAT attack - but only for office phone exchanges (PABX, ITSAR Group IV 2.12.10, 2.12.12); none of the 64 published ITSARs covers satellite equipment (checked 8 Nov 2026). IN-SPACe's authorisation norms (NGP 2024, which applicants warrant they will follow) contain one satellite-specific line - "Assure cyber security including encryptions at design level and prevent unauthorized commandeering of satellite through adequate data security" (Chapter XI B(v), PDF p. 71) - with no named standard, control list or audit, deviations approved case by case, and nothing on gateways, management networks or user terminals, the parts KA-SAT attacked. No detailed, auditable satellite-specific cyber-resilience baseline (binding controls a regulator can check, covering space, ground and terminal segments) was found in the sources we checked, as of 2026-11-08.
  evidence: [IN-PIB-2026-SPACEFW-ADVISORY, IN-AUTHZ-2026-R54-1, IN-AUTHZ-2026-R60-1, IN-AUTHZ-2026-R62-2, IN-AUTHZ-2026-R62-7, IN-AUTHZ-2026-R59-4, IN-SPACEFW-2026-SDLS, IN-SPACEFW-2026-3-2-1, IN-NCCS-ITSAR-G4-2-12-10, IN-NGP-2024-XI-B-v]
  affects: [satellite_operator, mobile_operator, critical_service_customer, cert_in]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["satellite", "earth station", "gateway", "telecommand|telemetry|TT&C", "encrypt", "authenticat*", "segmentation", "key management", "interference", "advisory", "binding", "sabotage", "ITSAR (NCCS list, 8 Nov)", "management interface", "VPN"]
    nearest_provision:
      source: in-space-fw-2026
      pinpoint: PDF p. 17
      quote: "Adopt standardized and validated cryptographic protocols (e.g., FIPS 140-3, Consultative Committee for Space Data Systems Space Data Link Security (CCSDS SDLS), Advanced Encryption Standard (AES)-256)."
    why_not_covered: PIB release 2233122 (26 Feb 2026) - "These guidelines are advisory in nature". The framework's §3.2 heading says "Regulatory Obligations", but no legal basis is stated. The binding rules are general (any telecom network), about sovereignty and interception, or about interference on direction; GMPCS conditions 41.7 and 41.9 set outcomes (privacy, counter sabotage), not satellite controls.
  analysis:
    impact: A KA-SAT-style attack (2022 - a misconfigured VPN gave access to the satellite operator's management network, and commands from it disabled tens of thousands of user terminals) would breach general duties but no binding satellite-specific control that a regulator could audit. The same two controls are already mandated for an office PABX. Context only, not evidence - the "Don't Look Up" study (ACM CCS 2025) found about half of the GEO satellite traffic it observed was unencrypted.
    affected: [satellite_operator, critical_service_customer]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: null
    owner: gap_analyst
    action: Treat framework controls as advice and flag missing ones in every plan; a person decides.
  recommendation:
    regulator: [DoT, CERT-In]
    ask: Make a core set of the framework's satellite controls binding, for example as Authz Rule 62 security conditions or a standard notified under Telecom Act s.19.
  global_examples:
  - tier: verified
    record: EU-NIS2-2022-ANNEX-I-SPACE
    jurisdiction: EU
    instrument: Directive (EU) 2022/2555 (NIS2)
    authority: European Parliament and Council
    clause: Annex I, sector 11 (Space)
    binding_status: binding
    quote: Operators of ground-based infrastructure, owned, managed and operated by Member States or by private parties, that support the provision of space-based services, excluding providers of public electronic communications networks
    shows: Space ground infrastructure is a binding NIS2 sector (ground segment only).
    relation: covered_abroad
  - tier: verified
    record: EU-NIS2-2022-ART21-2-c
    jurisdiction: EU
    instrument: Directive (EU) 2022/2555 (NIS2)
    authority: European Parliament and Council
    clause: Article 21(2)(c)
    binding_status: binding
    quote: business continuity, such as backup management and disaster recovery, and crisis management;
    shows: So binding NIS2 Art. 21 measures apply to space ground operators.
    relation: covered_abroad
  - tier: auto_checked
    staged: eu-space-programme-2021-696
    jurisdiction: EU
    instrument: Regulation (EU) 2021/696 of the European Parliament and of the Council of 28 April 2021 establishing the Union Space Programme and the European Union Agency for
    authority: European Parliament and Council
    clause: Article 34(1)(a)
    page: 42
    binding_status: binding
    quote: the protection of infrastructure, both ground and space, and of the provision of services, particularly against physical or cyber-attacks, including interference with data streams;
    shows: Binding protection of ground and space infrastructure against cyber-attacks, for EU Space Programme components only.
    relation: covered_abroad
  verified: true
  verified_by: Charan Velavan, 2026-11-08 (human review of nearest provision and reasoning); v3.4 narrowed wording approved by Charan Velavan, 2026-11-08, after the second-model evidence review (docs/review/chatgpt_review_part1.md, row 6)
  notes: Headline gap. Replaces v2 GAP-IN-09-SPACE-FW-STATUS (resolved by PIB 2233122). Comparison - NIS2 (EU-NIS2-2022-ANNEX-I-SPACE) brings space ground operators under binding general duties, which is parity with Authz Rule 54, not a satellite-specific baseline; the EU Space Act proposal COM(2025) 335 would add satellite-specific rules but is only a proposal (docs/sweep/checklist.yaml). So no binding comparator is claimed. Sub-points parked (Goldfish G3) - no space ISAC or binding threat-sharing duty (CL-20, SD-08); satellite compromise is not a named CERT-In Annexure I incident type (SD-17). v3.3 (8 Nov) - ITSAR check - source in-nccs-itsar-csr-g4-2026 and the NCCS ITSAR list were checked for this gap only. Sweep CL-01..04, CL-06, CL-10, CL-11, CL-14, CL-15, CL-22, CL-35, SD-01, SD-02, SD-05, SD-16.
