  finding: 3GPP TR 33.700-29 leaves feeder links out of scope, and no standard machine-readable format for policy rules was found; ORCA-NTN uses YAML.
  evidence: []
  affects: [regulator, standards_bodies]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["feeder link", "machine-readable", "policy as code"]
    nearest_provision:
      source: null
      pinpoint: null
      quote: null
    why_not_covered: The 3GPP and ITU-T texts are not in kb/sources; the finding rests on charan/country-documents.md and must stay candidate until they are opened.
  analysis:
    impact: Each operator writes its own rule format, so rules cannot be shared or checked across borders.
    affected: [regulator, standards_bodies]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: null
    owner: gap_analyst
    action: Publish the ORCA-NTN YAML rule format with the code.
  recommendation:
    regulator: [3GPP SA3, ITU-T SG17]
    ask: Bring feeder links into scope; start work on a machine-readable policy-rule format.
  verified: false
  verified_by: null

- id: GAP-IN-07-NO-JOINT-PLAN
  jurisdiction: IN
  kind: coverage
  topic: joint_command
  status: candidate
  title: No common cross-institution incident plan
  finding: Each body keeps its own plan (a Cyber Crisis Management Plan per CTI owner and per SatCom operator) and the space framework asks for "rapid coordination". No source we checked names one incident commander, evidence-sharing authority and decision owner for an incident that spans satellite operator, mobile operator, utility, CERT-In and regulator.
  evidence: [IN-CERTIN-DIR-2022-ii, IN-TCSR-2024-R7-1, IN-DPDP-ACT-2023-8-6]
  affects: [all]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["incident commander", "crisis management plan", "single point of contact", "coordinat* among|between", "nodal"]
    nearest_provision:
      source: in-space-fw-2026
      pinpoint: §7.2 (incident response), PDF p. 34
      quote: "Rapid coordination among the mission control, ground station operators, network administrators, and national cybersecurity agencies shall be ensured for unified response actions."
    why_not_covered: Asks for coordination but names no lead, no decision owner and no evidence-sharing rule across institutions; the framework's legal status is not stated.
  analysis:
    impact: In a cross-sector attack, each body acts on its own clock and evidence, and nobody owns the joint decision.
    affected: [all]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: null
    owner: human_commander
    action: ORCA's human incident-commander role plus one shared audit log.
  recommendation:
    regulator: [CERT-In, DoT]
    ask: Name a cross-institution incident lead for NTN incidents (NDMA's role to be checked).
  verified: false
  verified_by: null

- id: GAP-IN-08-NO-CLEAN-PATH-CHECK
  jurisdiction: IN
  kind: coverage
  topic: failover_path_security
  status: candidate
  title: No rule requires the backup path to be checked clean before failover during an attack
  finding: The space framework asks operators to "establish mechanisms for failover operations". No source we checked requires the backup path to be verified uncompromised before traffic is moved during an attack, although jamming-forced failover is a known attack path.
  evidence: []
  affects: [mobile_operator, satellite_operator]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["failover", "fail-over", "redundan*", "alternate path|route|link", "backup link|path|network"]
    nearest_provision:
      source: in-space-fw-2026
      pinpoint: §5.9 (Incident Preparedness and Resilience), PDF p. 18
      quote: "Establish mechanisms for failover operations and rapid restoration of affected services."
    why_not_covered: Asks for failover to exist, not for the backup path to be checked before use during an attack; the framework's legal status is not stated.
  analysis:
    impact: An attacker who jams the primary link can push traffic onto a path they already control.
    affected: [mobile_operator, critical_service_customer]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: PB-06
    owner: mobile_operator
    action: PB-06 checks the backup path is clean before failover.
  recommendation:
    regulator: [DoT, ITU-T SG17]
    ask: Make a clean-path check a security precondition for failover on NTN backhaul.
  verified: false
  verified_by: null

- id: GAP-IN-09-SPACE-FW-STATUS
  jurisdiction: IN
  kind: ambiguity
  topic: space_cyber
  status: candidate
  title: The 2026 space framework's legal status is not stated
  finding: The CERT-In / SIA-India space framework uses "must" and "shall" (for example the six-hour report in §3.2.1) but does not say whether it binds, under which power it was issued, or what follows from non-compliance.
  evidence: [IN-SPACEFW-2026-3-2-1, IN-SPACEFW-2026-ANXB-IV]
  affects: [satellite_operator, cert_in]
  search:
    date: 2026-11-07
    sources_checked: [in-space-fw-2026, in-itact-2000, in-certin-dir-2022]
    terms: ["70B", "binding", "mandatory", "advisory", "issued under", "non-compliance", "penal*"]
    nearest_provision:
      source: in-space-fw-2026
      pinpoint: §3.2.1, PDF p. 11
      quote: "All SatCom operators and service providers must report cybersecurity incidents, breaches, or anomalies within 6 hours of noticing the incident to CERT-In."
    why_not_covered: Mandatory wording without a stated legal basis. A human or the issuing authority must decide whether it binds.
  analysis:
    impact: Operators cannot tell whether the framework's controls (failover, stakeholder notice, CCMP) are duties or advice.
    affected: [satellite_operator]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: null
    owner: human_commander
    action: Treat its six-hour clock as binding for safety (protective filing).
  recommendation:
    regulator: [CERT-In]
    ask: State the framework's legal basis and status.
  verified: false
  verified_by: null
  notes: Search terms for this gap have not yet been run as a full sweep; the finding rests on the citation check (5 Nov) and must be re-run before confirming.
