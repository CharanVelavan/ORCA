# Gap register v3.1 (7 Nov 2026, night). What the sources we checked do NOT contain, with the
# search that shows it. Schema: kb/SCHEMA.md. Evidence standard: docs/sweep/gap-evidence-standard.md.
#
# Every gap is `status: candidate` until a human reads its search record and confirms or rejects it
# (`status: confirmed|rejected`, `verified: true`, `verified_by: <name, date>`). Claude does not decide gaps.
# Human review 8 Nov 2026 (Charan Velavan): confirmed 01, 02, 03, 04, 06, 09; 08 confirmed as partial; rejected 05 and 07.
# Wording rule: "not found in the sources we checked, as of 2026-11-07". Titles are short labels;
# each finding carries the dated, scoped claim.
#
# Glossary
#   NTN      non-terrestrial (satellite-backed) network          CERT-In  Indian Computer Emergency Response Team
#   DoT      Department of Telecommunications                    TRAI     Telecom Regulatory Authority of India
#   TCSR     Telecom Cyber Security Rules, 2024 (G.S.R. 720(E))   CTI(R)   Critical Telecommunication Infrastructure (Rules, 2024)
#   Authz    Telecom Authorisation Rules, 2026 (G.S.R. 513(E))   SOP      DoT disaster Standard Operating Procedure, 2017
#   STDCC    State Telecom Disaster Co-ordination Committee      PIB      Press Information Bureau (Government of India)
#   DPDP     Digital Personal Data Protection Act / Rules        CEA      Central Electricity Authority
#   112      India's single emergency number                     backhaul the link that carries a tower's traffic to the core
#   PB-xx    an ORCA-NTN response playbook (docs/plan)           "new authorised entity" = licensee under the 2026 Authz Rules
#
# Not searched (scope limits; a gap may be covered there): Unified/UASL licence conditions for operators
# not yet migrated to the 2026 Authz Rules, the national Cyber Crisis Management Plan, NCIIPC rules, CERT-In
# Rules 2013, the Disaster Management Act 2005, IN-SPACe / Department of Space norms, TEC essential
# requirements (non-security parts of MTCTE), and sector regulators of dependants (RBI, CEA cyber rules).
# Searched 8 Nov: the NCCS list of 64 published ITSARs (no satellite-equipment ITSAR; see GAP-IN-09).
#
# History
#  v3.3 (8 Nov) ITSAR check for GAP-IN-09: new record IN-NCCS-ITSAR-G4-2-12-10; GAP-IN-09 text names the
#       KA-SAT entry points as examples. Status unchanged (confirmed); the reviewer should re-read the new text.
#  v3   (7 Nov) policy sweep (docs/sweep/): 17 Indian sources; PIB 2233122 says the space framework is
#       advisory; GAP-IN-09 became the headline gap.
#  v3.1 (7 Nov, Goldfish review round 1: Sonnet G1, Gemini G2/G3; docs/sweep/goldfish-round1.md)
