- id: GAP-IN-01-REPORTING-CLOCKS
  jurisdiction: IN
  kind: ambiguity
  topic: incident_reporting
  status: confirmed
  title: Up to four reports to three bodies, with two different triggers
  finding: For one NTN incident a telecom entity reports to CERT-In within six hours of noticing it and to DoT within six hours of becoming aware of it (details within 24 hours). If it also owns designated Critical Telecommunication Infrastructure, it reports within six hours of the incident's occurrence. An access provider whose service is down in a district for more than four hours also files a quality-of-service outage report to TRAI within 24 hours of the outage start (a service-availability report, not a cyber report, but due in the same event). An outage first treated as a fault can pass the occurrence deadline before it is recognised as an attack. (Satellite licensees also report rogue signals and unregistered terminals under Authz Rules 59(4) and 62(7), with no deadline.) No text saying which clock governs, or allowing one joint report, was found in the sources we checked, as of 2026-11-07.
  evidence: [IN-CERTIN-DIR-2022-ii, IN-TCSR-2024-R7-1, IN-CTIR-2024-R7-1-j, IN-TRAI-QOS-2024-4-1-3]
  affects: [satellite_operator, mobile_operator, cert_in, dot, trai]
  search:
    date: 2026-11-07
    sources_checked: &IN_ALL [in-certin-dir-2022, in-certin-faq-2022, in-itact-2000, in-telact-2023, in-tcsr-2024, in-tcsr-2025-amendment, in-ctir-2024, in-space-fw-2026, in-pib-space-fw-2026, in-dpdp-act-2023, in-dpdp-rules-2025, in-dpdp-rules-2025-corrigendum, in-authz-rules-2026, in-dot-disaster-sop-2017, in-trai-qos-2024, in-cea-comm-2020, in-dot-gmpcs-licence]
    terms: ["6 hours", "six hours", "becoming aware", "noticing", "occurrence", "24 Hrs", "twenty-four hours", "single report", "joint report", "portal"]
    nearest_provision:
      source: in-ctir-2024
      pinpoint: Rule 7(1)(j), PDF p. 8
      quote: "implement mechanisms to ensure intimation of security incident(s) to the Central Government, no later than six hours of occurrence of such incident, in the form and manner as may be specified on the portal"
    why_not_covered: Each rule sets its own trigger and recipient. The DoT rules leave the "form and manner" to a portal, which could host one joint report, but none was found. CERT-In Direction (ii) runs separately under the IT Act.
  analysis:
    impact: Staff track up to four deadlines for three recipients while handling the attack. For CTI owners, a late attack classification can turn a timely report into a missed one.
    affected: [satellite_operator, mobile_operator]
    comparison:
      EU: EU-NIS2-2022-ART23-4-a
      AE: null
  interim_action:
    playbook: null
    owner: human_commander
    action: File at the earliest deadline as a precaution; ORCA-NTN drafts each notice and a person sends them.
  recommendation:
    regulator: [DoT, CERT-In, TRAI]
    ask: One trigger ("becoming aware") and one joint portal for NTN incident reports to CERT-In, DoT and TRAI.
  global_examples:
  - tier: verified
    record: EU-NIS2-2022-ART23-4-a
    jurisdiction: EU
    instrument: Directive (EU) 2022/2555 (NIS2)
    authority: European Parliament and Council
    clause: Article 23(4)(a)
    binding_status: binding
    quote: without undue delay and in any event within 24 hours of becoming aware of the significant incident, an early warning, which, where applicable, shall indicate whether the significant incident is suspected of being caused by unlawful or malicious acts or could have a cross-border impact
    shows: One trigger (becoming aware) and one recipient, with staged 24 h / 72 h / one-month reports.
    relation: covered_abroad
  - tier: auto_checked
    staged: eu-cer-2022-2557
    jurisdiction: EU
    instrument: Directive (EU) 2022/2557 of the European Parliament and of the Council of 14 December 2022 on the resilience of critical entities and repealing Council Directiv
    authority: European Parliament and Council
    clause: Article 15(1)
    page: 22
    binding_status: binding
    quote: Member States shall ensure that, unless operationally unable to do so, critical entities submit an initial notification no later than 24 hours after becoming aware of an incident, followed, where relevant, by a detailed report no later than one month thereafter.
    shows: 'Critical entities: one trigger (becoming aware), 24 h initial notification.'
    relation: covered_abroad
  - tier: auto_checked
    staged: us-fcc-part-4-outage
    jurisdiction: US
    instrument: '47 CFR Part 4: Disruptions to Communications (Network Outage Reporting System - NORS)'
    authority: Federal Communications Commission
    clause: 47 CFR § 4.9(c)(1)
    page: null
    binding_status: binding
    quote: 'All satellite operators shall submit electronically a Notification to the Commission within 120 minutes of discovering that they have experienced on any facilities that they own, operate, lease, or otherwise utilize, of an outage of at least 30 minutes duration that manifests itself as a failure of any of the following key system elements: One or more satellite transponders, satellite beams, inter-satellite links, or entire satellites.'
    shows: Satellite operators report outages to one body, with the clock running from discovery (120 minutes).
    relation: covered_abroad
  verified: true
  verified_by: Charan Velavan, 2026-11-08 (human review of nearest provision and reasoning)
  notes: Sweep SD-15, CL-16, CL-17. Corrected in v3.1 - external-review lead R1 was right (the notified TCSR counts from "becoming aware"). For a telecom entity that is not a CTI owner, the CERT-In and DoT clocks now start at about the same moment; the conflict is sharpest for CTI owners. The advisory space framework's 6 h line is not counted. The EU comparison shows one trigger and one recipient per incident (NIS2 Art. 23(4)); it is not a joint multi-regulator portal. The CTI case assumes the operator owns designated CTI.

- id: GAP-IN-02-NO-DOWNSTREAM-WARNING
  jurisdiction: IN
  kind: coverage
  topic: downstream_warning
  status: confirmed
  title: No binding duty for a satellite operator to warn the services that depend on it
  finding: Reports flow to CERT-In, DoT and TRAI. CERT-In's statutory role includes disseminating incident information and alerts, and the government may tell the public or require the operator to do so (TCSR Rule 7(2)). New authorised entities may not share network information with others without prior written government approval (Authz Rule 37(5)). The text on an operator warning its dependants is in the advisory space framework (Annexure B item 4.2; coordination in §6.5 and §9.2), with no deadline. No binding duty for a satellite operator to warn the mobile operators, utilities, hospitals or banks that use its ground network was found in the sources we checked, as of 2026-11-07.
  evidence: [IN-TCSR-2024-R7-2, IN-ITACT-2000-70B-4, IN-AUTHZ-2026-R37-5, IN-AUTHZ-2026-R38-2-a, IN-SPACEFW-2026-ANXB-IV, IN-PIB-2026-SPACEFW-ADVISORY]
  affects: [satellite_operator, mobile_operator, power_utility, critical_service_customer]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["inform* … user|customer|subscriber|stakeholder", "notify|alert|warn", "alert messages", "dissemination", "share any information", "recipients of", "downstream", "disclosure"]
    nearest_provision:
      source: in-space-fw-2026
      pinpoint: Annexure B, item 4.2 (Respond), PDF p. 48
      quote: "Stakeholders: Establish procedures for notifying critical infrastructure partners, regulatory bodies, and customers, especially when service disruption occurs."
    why_not_covered: Advisory guidance (PIB 2233122) that asks for procedures, not a warning. TCSR 7(2) and Authz 38(2)(a) are government powers to tell the public; CERT-In's alerts are an agency function. Authz 37(5) may require prior approval before an operator warns others about its network.
  analysis:
    impact: Banks, hospitals and utilities on the same ground network learn of the attack late, after their own failover or fraud checks should have started.
    affected: [mobile_operator, power_utility, critical_service_customer]
    comparison:
      EU: EU-NIS2-2022-ART23-1
      AE: null
  interim_action:
    playbook: PB-10
    owner: satellite_operator
    action: Send a human-approved warning to the dependent services, after checking whether Rule 37(5) approval is needed.
  recommendation:
    regulator: [DoT, CERT-In]
    ask: A binding duty, with a deadline, for NTN operators to warn the services that depend on them, with a standing Rule 37(5) approval for such warnings; compare NIS2 Art. 23(1) and 23(2).
  global_examples:
  - tier: verified
    record: EU-NIS2-2022-ART23-1
    jurisdiction: EU
    instrument: Directive (EU) 2022/2555 (NIS2)
    authority: European Parliament and Council
    clause: Article 23(1), second sentence
    binding_status: binding
    quote: Where appropriate, entities concerned shall notify, without undue delay, the recipients of their services of significant incidents that are likely to adversely affect the provision of those services.
    shows: Binding duty to notify the recipients of services of significant incidents.
    relation: covered_abroad
  - tier: verified
    record: EU-NIS2-2022-ART23-2
    jurisdiction: EU
    instrument: Directive (EU) 2022/2555 (NIS2)
    authority: European Parliament and Council
    clause: Article 23(2)
    binding_status: binding
    quote: essential and important entities communicate, without undue delay, to the recipients of their services that are potentially affected by a significant cyber threat any measures or remedies that those recipients are able to take in response to that threat
    shows: Binding duty to tell affected recipients about measures they can take against a significant cyber threat.
    relation: covered_abroad
  verified: true
  verified_by: Charan Velavan, 2026-11-08 (human review of nearest provision and reasoning)
  notes: Sweep SD-11, CL-19. Sector regulators of the dependants (RBI for banks; CEA Reg. 14 for power users) are not in our sources; their own duties are out of scope here. v3.4 (8 Nov) - second-model (ChatGPT) review of staged quotes, docs/review/chatgpt_review_part*.md; the claim stays as worded (already scoped to an explicit/binding duty).

- id: GAP-IN-03-NO-PRIORITY-ORDER
  jurisdiction: IN
  kind: ambiguity
  topic: capacity_priority
  status: confirmed
  title: Priority callers exist for disaster restoration, but no ranking for sharing scarce backup capacity
  finding: The DoT disaster SOP names priority callers (emergency operation centres, police, fire, medical, financial institutions and others) for emergency communication and restoration. New licensees must follow government disaster guidelines (Authz Rule 38(1)), which may give the SOP force for them. TRAI asks that voice calls get end-to-end priority on IP interconnection, and Telecom Act s.20(1)(b) lets government order responder messages routed on priority. New licensees must also connect to emergency services and the State disaster platform (Authz Rules 67(1), 71(1)(h)). No standing rule that ranks 112 callers, hospitals, payments and ordinary traffic when satellite backhaul is too small for all of them was found in the sources we checked, as of 2026-11-07.
  evidence: [IN-DOT-SOP-2017-3-2-5, IN-AUTHZ-2026-R38-2-a, IN-TELACT-2023-20]
  affects: [mobile_operator, satellite_operator, dot]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["priorit*", "priority callers", "priority user groups", "emergency call", "112", "PSAP", "routed on priority", "end-to-end priority"]
    nearest_provision:
      source: in-dot-disaster-sop-2017
      pinpoint: §3.2.5, PDF p. 12 (also §6.2(i), p. 16 "provide emergency communication to priority callers")
      quote: "Priority is to be given to these groups for provisioning of additional communication facilities and restoration of telecom services, if required, for quick and efficient rescue and relief operations."
    why_not_covered: The SOP lists who comes first for restoration, as an open list; it does not rank classes of live traffic on a constrained link. Its status depends on Authz 38(1) and is otherwise not stated. The Authz emergency-service duties guarantee access, not a ranking. Section 20(1)(b) is a case-by-case power, and its commencement notification is not in our sources.
  analysis:
    impact: The operator decides alone who gets the remaining backup capacity, with no binding ranking to point to.
    affected: [mobile_operator, critical_service_customer]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: PB-06
    owner: mobile_operator
    action: Share the remaining capacity using the SOP priority callers with 112 first, then switch traffic to the backup link; a person approves.
  recommendation:
    regulator: [DoT, TRAI]
    ask: Turn the SOP priority callers into a standing, ordered list for scarce backup capacity, including satellite backhaul.
  global_examples:
  - tier: verified
    record: AE-TDRA-IC-2006-EMERGENCY
    jurisdiction: AE
    instrument: TDRA Interconnection Instructions, Version 1.2
    authority: TDRA (UAE)
    clause: Emergency calls
    binding_status: binding
    quote: All emergency calls must be treated with the highest priority within the Points of Interconnection.
    shows: Emergency calls get the highest priority at interconnection (UAE, host country).
    relation: covered_abroad
  - tier: auto_checked
    staged: eu-eecc-2018-1972
    jurisdiction: EU
    instrument: Directive (EU) 2018/1972 of the European Parliament and of the Council of 11 December 2018 establishing the European Electronic Communications Code
    authority: European Parliament and Council
    clause: Article 108
    page: 146
    binding_status: binding
    quote: Member States shall ensure that providers of voice communications services take all necessary measures to ensure uninterrupted access to emergency services and uninterrupted transmission of public warnings.
    shows: Binding duty to keep emergency access and public warnings uninterrupted in a network breakdown.
    relation: covered_abroad
  - tier: auto_checked
    staged: itu-constitution-art40
    jurisdiction: International
    instrument: 'Constitution of the International Telecommunication Union - Article 40: Priority of Telecommunications Concerning Safety of Life'
    authority: International Telecommunication Union (ITU)
    clause: Article 40, Provision 191
    page: 84
    binding_status: binding
    quote: International telecommunication services must give absolute priority to all telecommunications concerning safety of life at sea, on land, in the air or in outer space, as well as to epidemiological telecommunications of exceptional urgency of the World Health Organization.
    shows: ITU treaty priority for safety-of-life traffic; India is a Member State, but the article covers international services, not domestic capacity allocation.
    relation: covered_abroad
  verified: true
  verified_by: Charan Velavan, 2026-11-08 (human review of nearest provision and reasoning)
  notes: Sweep SD-12, CL-28. No comparison claimed - the UAE TDRA rule (AE-TDRA-IC-2006-EMERGENCY) gives emergency calls top priority at interconnection points but ranks no other services, and India has comparable emergency-access duties (removed v3.2, Goldfish round 3). TRAI's IP voice-priority line (QoS 4.2.1(iii), "should") has no KB record yet. v3.4 (8 Nov) - second-model (ChatGPT) review of staged quotes, docs/review/chatgpt_review_part*.md; the claim stays as worded (already scoped to an explicit/binding duty).

- id: GAP-IN-04-NO-BATTERY-FLOOR
  jurisdiction: IN
  kind: ambiguity
  topic: backup_power
  status: confirmed
  title: Telecom sites must have power redundancy, but no minimum hours are set
  finding: TRAI requires access providers' quality plans to provide "required redundancies including power", and the DoT SOP asks for "sufficient" battery and fuel backup at vulnerable sites. Neither sets a number of hours. India already sets a 10-hour battery floor for power-grid communication nodes (CEA Reg. 8(11)). No numeric backup floor for telecom sites, including satellite gateways, was found in the sources we checked, as of 2026-11-07.
  evidence: [IN-TRAI-QOS-2024-3-2, IN-DOT-SOP-2017-3-1-3, IN-CEA-2020-8-11]
  affects: [mobile_operator, satellite_operator, power_utility]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["battery", "batteries", "backup power", "power backup", "redundanc*", "diesel", "UPS", "hours"]
    nearest_provision:
      source: in-trai-qos-2024
      pinpoint: Regulation 3(2), PDF p. 101
      quote: "The quality management plan shall provide for required redundancies including power, transmission links, equipment, geo-redundancies in the core network and access network as per relevant standards to achieve end-to-end QoS as per the benchmarks specified in these regulations."
    why_not_covered: The TRAI duty is binding but sets no hours; the SOP says "sufficient". CEA 8(11) is numeric but covers power-sector communication nodes, not telecom sites.
  analysis:
    impact: During a long grid outage a site can drain its battery while the operator still meets TRAI's monthly cell-downtime benchmark (2% falling to 1%, PDF p. 102), because that benchmark averages over a month and sets no hours of autonomy per site.
    affected: [mobile_operator, critical_service_customer]
    comparison:
      EU: null
      AE: null
  interim_action:
    playbook: PB-09
    owner: mobile_operator
    action: Shed non-critical load to stretch the battery, using the operator's own threshold.
  recommendation:
    regulator: [DoT, TRAI]
    ask: A minimum backup-power autonomy for sites that carry emergency traffic; India's CEA 10-hour rule for grid communication nodes is a domestic model.
  global_examples:
  - tier: auto_checked
    staged: us-cpuc-d20-07-011-2020
    jurisdiction: US-CA
    instrument: Decision Adopting Wireless Provider Resiliency Strategies (D.20-07-011)
    authority: California Public Utilities Commission (CPUC)
    clause: Ordering Paragraph 2
    page: 148
    binding_status: binding
    quote: Facilities-based wireless providers shall, in their Communications Resiliency Plan pursuant to Section 6.5.2 of this decision, demonstrate their ability to meet the 72-hour backup power requirement, in Tier 2 and Tier 3 High Fire Threat Districts
    shows: 'California: binding 72-hour backup power for wireless facilities in high fire-threat areas.'
    relation: covered_abroad
  - tier: auto_checked
    staged: us-cpuc-d21-02-029-2021
    jurisdiction: US-CA
    instrument: Decision Adopting Wireline Provider Resiliency Strategies (D.21-02-029)
    authority: California Public Utilities Commission (CPUC)
    clause: Ordering Paragraph 4
    page: 106
    binding_status: binding
    quote: 'Facilities-based wireline providers shall, in their Communications Resiliency Plan pursuant to Section 5.6.2 of this decision, demonstrate their ability to: (a) meet the 72-hour backup power requirement, in Tier 2 and Tier 3 High Fire Threat Districts'
    shows: 'California: the same 72-hour floor for wireline facilities.'
    relation: covered_abroad
  - tier: auto_checked
    staged: us-fcc-911-reliability-2013
    jurisdiction: US
    instrument: Improving 911 Reliability; Reliability and Continuity of Communications Networks, Including Broadband Technologies (FCC 13-158)
    authority: Federal Communications Commission (FCC)
    clause: Appendix B, 47 CFR § 12.4(c)(2)(i)(C)
    page: 68
    binding_status: binding
    quote: Provisions backup power through fixed generators, portable generators, batteries, fuel cells, or a combination of these or other such sources to maintain full-service functionality, including network monitoring capabilities, for at least 24 hours at full office load or, if the central office hosts a Selective Router, at least 72 hours at full office load; provided, however, that any such portable generators shall be readily available within the time it takes the batteries to drain, notwithstanding potential demand for such generators elsewhere in the service provider’s network.
    shows: 'US federal: 911 central offices must provision backup power (certification duty; no hour figure).'
    relation: covered_abroad
  verified: true
  verified_by: Charan Velavan, 2026-11-08 (human review of nearest provision and reasoning)
  notes: Sweep SD-13, CL-29. Comparison is domestic (CEA Reg. 8(11)); no EU or UAE numeric rule is in our sources. ORCA's M2 model forecasts battery run-out against the operator's threshold.

- id: GAP-IN-05-NO-BREACH-CLOCK-TODAY
  jurisdiction: IN
  kind: coverage
  topic: personal_data_breach
  status: rejected
  title: The DPDP breach notice is not in force until May 2027
  finding: DPDP Act s.8(6) and DPDP Rules Rule 7 (notice to affected people, and a report to the Data Protection Board within 72 hours) commence on 13 May 2027. Today CERT-In's six-hour report covers data breaches, but it goes to the agency, not to the people affected. No duty in force today to tell affected people about a personal-data breach was found in the sources we checked, as of 2026-11-07.
  evidence: [IN-DPDP-ACT-2023-8-6, IN-DPDP-RULES-2025-R7, IN-CERTIN-DIR-2022-ANX1-xi]
  affects: [mobile_operator, satellite_operator, data_principals]
  search:
    date: 2026-11-07
    sources_checked: *IN_ALL
    terms: ["personal data breach", "seventy-two hours", "eighteen months", "come into force", "without delay", "Data Breach"]
    nearest_provision:
      source: in-dpdp-rules-2025
      pinpoint: Rule 7(2)(b), PDF p. 26 (commencement - Act footnote, PDF p. 5, G.S.R. 843(E))
      quote: "within seventy-two hours of becoming aware of the breach, or within such longer period as the Board may allow on a request made in writing in this behalf"
    why_not_covered: The duty is enacted but not yet in force. The corrigendum (G.S.R. 892(E), Gazette 11 Dec 2025) corrects the commencement wording, not the periods.
  analysis:
    impact: Subscribers whose data leaks in an NTN attack have no DPDP right to be told until May 2027.
    affected: [data_principals]
    comparison:
      EU: EU-GDPR-2016-ART34-1
      AE: null
  interim_action:
    playbook: null
    owner: satellite_operator
    action: Draft a voluntary notice to affected people, clearly marked voluntary; a person decides.
  recommendation:
    regulator: [MeitY, Data Protection Board]
    ask: Interim guidance on notifying affected people before May 2027; compare GDPR Art. 34(1).
  verified: true
  verified_by: Charan Velavan, 2026-11-08 - REJECTED. Reason (reviewer) - the law exists (DPDP Act 2023 and Rules 2025); only its start date is deferred to 13 May 2027, so it is a transition period, not a policy gap.
  notes: A transition-period gap, not an absence of law ("data principals" = the people whose data it is). Kept as coverage because no notice duty is in force today; reviewers G1 and G3 suggested another kind (contested, see goldfish-round1.md). Not NTN-specific; kept because subscriber data is in the demo scenario.

- id: GAP-IN-06-STANDARDS
  jurisdiction: INTL
  kind: standards
  topic: standards
  status: confirmed
  title: Feeder-link and inter-satellite-link security is left unspecified, and India has not used its standards power
  finding: 3GPP TR 33.700-29 says feeder links (gateway to satellite) and inter-satellite links "are not specified in 3GPP" and that generic IP security "can be used". In India, the Telecom Act s.19 lets the government notify telecom security, cyber-security and encryption standards, but no notified standard for satellite links was found in the sources we checked, as of 2026-11-07. The advisory space framework names CCSDS SDLS (see GAP-IN-09). IN-SPACe's NGP 2024 asks satellites for "encryptions at design level" (Chapter XI B(v), PDF p. 71) but names no standard and does not cover feeder or inter-satellite links as such.
  evidence: [IN-TELACT-2023-19, IN-SPACEFW-2026-SDLS]
