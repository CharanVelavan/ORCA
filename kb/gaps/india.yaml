#         G.S.R. 720(E): Rule 7(1)(a) counts six hours from "becoming aware", plus 24 h details. GAP-IN-01 rewritten.
#       - GAP-IN-06 narrowed to link security (advisory framework names CCSDS SDLS); policy-format claim dropped.
#       - GAP-IN-08 reclassified as a technical-baseline (standards) gap.
#       - GAP-IN-09 narrowed: binding general security duties exist (Authz Rule 54, TCSR Rule 4); the gap is a
#         satellite-specific baseline.
#  v3.2 (7 Nov, Goldfish round 2: Sonnet G1, Gemini G3; docs/sweep/goldfish-round2.md)
#       - GAP-IN-07 reframed as ambiguity: CERT-In can direct operators (IT Act s.70B(6)); DoT's STDCC instructs
