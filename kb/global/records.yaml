- id: EU-NIS2-2022-ART23-2
  jurisdiction: EU
  instrument: Directive (EU) 2022/2555 (NIS2)
  clause: Article 23(2)
  authority: European Parliament and Council
  binding_status: binding
  issued: 2022-12-14
  in_force_from: null
  topic: incident_reporting
  topics: [incident_reporting, downstream_warning]
  obligation:
    actor: essential_or_important_entity
    action: inform_affected_service_recipients
    recipient: recipients of the entity's services
    deadline: null
    trigger: awareness
  quote: "essential and important entities communicate, without undue delay, to the recipients of their services that are potentially affected by a significant cyber threat any measures or remedies that those recipients are able to take in response to that threat"
  pinpoint: Article 23(2)
  summary: Tell potentially affected service recipients, without undue delay, what they can do about a significant cyber threat, and where appropriate about the threat itself.
  source: eu-nis2-2022
  verified: true
  verified_by: EUR-Lex text, fetched 7 Nov 2026
  notes: The EU has the downstream-warning duty that India lacks (GAP-IN-02). This is the key contrast for scenario 3.

- id: EU-GDPR-2016-ART33-1
  jurisdiction: EU
  instrument: Regulation (EU) 2016/679 (GDPR)
  clause: Article 33(1)
  authority: European Parliament and Council
  binding_status: binding
  issued: 2016-04-27
  in_force_from: 2018-05-25
  topic: personal_data_breach
  topics: [personal_data_breach]
  obligation:
    actor: controller
    action: notify_personal_data_breach
    recipient: supervisory authority
    deadline: PT72H
    trigger: awareness
  quote: "In the case of a personal data breach, the controller shall without undue delay and, where feasible, not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority competent in accordance with Article 55"
  pinpoint: Article 33(1)
  summary: Notify the supervisory authority within 72 hours of becoming aware, unless the breach is unlikely to risk people's rights and freedoms.
  source: eu-gdpr-2016
  verified: true
  verified_by: EUR-Lex text, fetched 7 Nov 2026
  notes: null

- id: AE-TDRA-IC-2006-EMERGENCY
  jurisdiction: AE
  instrument: TDRA Interconnection Instructions, Version 1.2
  clause: Emergency calls
  authority: TDRA (UAE)
  binding_status: binding
  issued: 2006-02-19
  in_force_from: null
  topic: emergency_priority
  topics: [emergency_priority]
  quote: "All emergency calls must be treated with the highest priority within the Points of Interconnection."
  pinpoint: PDF p. 21
  summary: Emergency calls get the highest priority at points of interconnection; dedicated capacity should be provided if possible. It does not rank other services for scarce backup capacity.
  source: ae-tdra-interconnection-2006
  verified: true
  verified_by: TDRA PDF, fetched 7 Nov 2026
  notes: null

- id: EU-NIS2-2022-ANNEX-I-SPACE
  jurisdiction: EU
  instrument: Directive (EU) 2022/2555 (NIS2)
  clause: Annex I, sector 11 (Space)
  authority: European Parliament and Council
  binding_status: binding
  issued: 2022-12-14
  in_force_from: null
  topic: space_cyber
  topics: [space_cyber]
  quote: "Operators of ground-based infrastructure, owned, managed and operated by Member States or by private parties, that support the provision of space-based services, excluding providers of public electronic communications networks"
  pinpoint: Annex I, Space
  summary: Space ground infrastructure operators are a NIS2 sector, so binding risk-management (Art. 21) and reporting (Art. 23) duties apply to them.
  source: eu-nis2-2022
  verified: true
  verified_by: EUR-Lex text on disk, read by Claude 7 Nov 2026
  notes: Ground segment only (space segment not covered). Comparison for GAP-IN-09.

