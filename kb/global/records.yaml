- id: EU-NIS2-2022-ART23-4-a
  jurisdiction: EU
  instrument: Directive (EU) 2022/2555 (NIS2)
  clause: Article 23(4)(a)
  authority: European Parliament and Council
  binding_status: binding
  issued: 2022-12-14
  in_force_from: null
  topic: incident_reporting
  obligation:
    actor: essential_or_important_entity
    action: early_warning
    recipient: CSIRT or competent authority
    deadline: PT24H
    trigger: awareness
  quote: "without undue delay and in any event within 24 hours of becoming aware of the significant incident, an early warning, which, where applicable, shall indicate whether the significant incident is suspected of being caused by unlawful or malicious acts or could have a cross-border impact"
  pinpoint: Article 23(4)(a)
  summary: Early warning within 24 hours of becoming aware, saying whether the incident is suspected to be malicious.
  source: eu-nis2-2022
  verified: true
  verified_by: EUR-Lex text, fetched 7 Nov 2026
  notes: A directive, so it applies through national transposition. NIS2 space coverage includes ground infrastructure only. The issued date (14 Dec 2022) is from memory.

