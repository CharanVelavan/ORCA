- id: EU-GDPR-2016-ART34-1
  jurisdiction: EU
  instrument: Regulation (EU) 2016/679 (GDPR)
  clause: Article 34(1)
  authority: European Parliament and Council
  binding_status: binding
  issued: 2016-04-27
  in_force_from: 2018-05-25
  topic: personal_data_breach
  topics: [personal_data_breach]
  quote: "When the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject without undue delay."
  pinpoint: Article 34(1)
  summary: Tell the people affected by a high-risk personal data breach without undue delay.
  source: eu-gdpr-2016
  verified: true
  verified_by: EUR-Lex text on disk, read by Claude 7 Nov 2026
  notes: Comparison for GAP-IN-05 (notice to affected people). Art. 33 is the notice to the authority.

