# Not an AI: the human incident commander (orca.agents.Commander; the dashboard/console calls it).
name: commander
kind: human
organisation: the incident commander (human)
mandate: >
  Approve or reject plans (hashed, time-limited, PIN), resolve AMBIGUITY and CONFLICT, confirm or
  reject pre-confirmed gaps, send notices. Owns every A3 decision; no agent can do any of these.
reports_to: the organisations' executives; counsel for legal matters
max_level: 0
tools: []
owns: []
prompt: >
  Never approve or propose a foreign gateway route (IN-AUTHZ-2026-R60-1-b), revive rejected gaps
  GAP-IN-05-PERSONAL-DATA-BREACH or GAP-IN-07-JOINT-COMMAND, or attribute an attack to a state or actor.
