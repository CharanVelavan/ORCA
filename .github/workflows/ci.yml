name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Validate KB and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Knowledge Base
        run: |
          python tools/validate_kb.py

      - name: Check Scenario Consistency
        run: |
          python scenarios/check_scen.py

      - name: Run Test Suite (Mock LLM, Offline, No Secrets)
        # Tests choose mock/scripted clients or a local HTTP fixture explicitly.
        # "mock" is not an endpoint URL; replay requires a request cache.
        env:
          ORCA_CHROMA_DIR: ${{ runner.temp }}/orca-unit-chroma
          ORCA_KBVEC_CACHE: ${{ runner.temp }}/orca-unit-cache
          ORCA_KBVEC_SNAPSHOTS: ${{ runner.temp }}/orca-unit-snapshots
        run: |
          python -m pytest -q
